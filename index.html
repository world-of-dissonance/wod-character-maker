<style>
  /* A navigator's desk: the questions on the left, the living sheet on the right, both on the sheet's own night sky. */
  :root {
    --ground: #121826;      /* deep indigo night behind everything */
    --panel: #1C2336;       /* question panels */
    --ink: #262F48;         /* tabs, inputs: the sheet's navy */
    --line: #3C4766;        /* hairlines and outlines */
    --text: #E6EEF3;
    --muted: #9AA6BF;
    --gold: #F2C14E;        /* the one accent: what's chosen */
    --teal: #5DC4B7;        /* the sheet's sky, used for derived numbers */
    --error: #F08A7E;
    --display: "Cinzel", "Trajan Pro", Georgia, serif;
    --caption: "EB Garamond", Garamond, Georgia, serif;
    --ui: "Fira Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "Fira Mono", ui-monospace, Consolas, monospace;
    --chamfer: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font: 15px/1.5 var(--ui);
    padding-block: 20px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  body::after { /* the sheet's swirl art, faint, behind the desk */
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: var(--swirls) center / cover no-repeat; opacity: .14;
  }
  ::selection { background: var(--gold); color: var(--ground); }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .top { max-width: 1400px; margin: 0 auto 18px; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
  .wordmark { font: 700 12px/1 var(--mono); letter-spacing: .28em; color: var(--muted); text-transform: uppercase; }
  h1 { margin: 6px 0 0; font: 600 clamp(26px, 4vw, 38px)/1.1 var(--display); letter-spacing: .02em; text-wrap: balance; }
  .example { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 14px; color: var(--muted);
             background: var(--panel); border: 1px solid var(--line); padding: 8px 8px 8px 14px; clip-path: var(--chamfer); }
  .example[hidden] { display: none; }
  .example b { color: var(--gold); font-weight: 600; }

  .desk { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 36rem) minmax(0, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 1040px) { .desk { grid-template-columns: minmax(0, 1fr); } }

  /* steps */
  .steps { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; padding: 0; list-style: none; counter-reset: step; }
  .steps button {
    font: 700 11.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    background: var(--ink); border: 0; padding: 9px 14px 9px 10px; cursor: pointer;
    clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
    transition: background-color .15s ease-out, color .15s ease-out;
  }
  .steps button::before { counter-increment: step; content: counter(step) " "; color: var(--line); }
  .steps button:hover { background: #2F3A5A; color: var(--text); }
  .steps button[aria-current="step"] { background: var(--gold); color: var(--ground); }
  .steps button[aria-current="step"]::before { color: #7a5d10; }
  .steps button.done::after { content: " \2022"; color: var(--teal); }

  .forge { background: var(--panel); border: 1px solid var(--line); padding: 22px 22px 18px; clip-path: var(--chamfer); min-width: 0; }
  .step h2 { margin: 0 0 4px; font: 600 22px/1.2 var(--display); }
  .step .lede { margin: 0 0 18px; color: var(--muted); max-width: 60ch; }
  .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
  .fields .wide { grid-column: 1 / -1; }
  @media (max-width: 520px) { .fields { grid-template-columns: minmax(0, 1fr); } }
  label { display: grid; gap: 5px; font: italic 17px/1.2 var(--caption); color: var(--text); }
  label small { font: 13px/1.4 var(--ui); color: var(--muted); font-style: normal; }
  input[type=text], textarea {
    width: 100%; font: 15px/1.45 var(--ui); color: var(--text); background: var(--ink);
    border: 1px solid var(--line); padding: 9px 11px; border-radius: 0;
  }
  textarea { min-height: 88px; resize: vertical; }
  input::placeholder, textarea::placeholder { color: #6E7A93; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr)); gap: 10px; }
  .card {
    text-align: left; font: inherit; color: inherit; cursor: pointer; display: grid; gap: 6px; align-content: start;
    background: var(--ink); border: 1px solid var(--line); padding: 12px 14px 14px; clip-path: var(--chamfer);
    transition: background-color .15s ease-out, border-color .15s ease-out, transform .15s ease-out;
  }
  .card:hover { background: #2C3655; transform: translateY(-1px); }
  .card[aria-checked="true"] { border-color: var(--gold); background: #2E3550; box-shadow: inset 3px 0 0 var(--gold); }
  .card .name { font: 600 17px/1.2 var(--display); }
  .card .about { font-size: 13.5px; color: var(--muted); }
  .card .path { font-size: 13.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font: 700 11px/1 var(--mono); letter-spacing: .05em; padding: 5px 7px; background: var(--ground); color: var(--teal); }
  .chip.pending { color: var(--gold); }

  /* aspects */
  .aspects { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .aspects th, .aspects td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--line); }
  .aspects th:first-child, .aspects td:first-child { text-align: left; font: italic 16px var(--caption); color: var(--muted); }
  .aspects thead th { font: 600 16px var(--display); color: var(--text); }
  .aspects tr.total td { font-weight: 600; font-size: 18px; color: var(--text); border-bottom: 0; }
  .aspects tr.total td:first-child { color: var(--text); }
  .stepper { display: inline-flex; align-items: center; gap: 6px; }
  .stepper button {
    width: 36px; height: 36px; font: 600 18px/1 var(--ui); color: var(--text); background: var(--ink);
    border: 1px solid var(--line); cursor: pointer;
  }
  @media (pointer: coarse) { .stepper button { width: 44px; height: 44px; } .stepper { gap: 2px; } }
  .stepper button:disabled { opacity: .35; cursor: default; }
  .stepper output { min-width: 1.5ch; }
  .pool { margin: 12px 0 0; font-size: 14px; color: var(--muted); }
  .pool b { color: var(--gold); }
  .derived { margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); gap: 8px; }
  .stat { background: var(--ink); padding: 10px 12px; clip-path: polygon(0 0, 100% 0, 100% 100%, 8px 100%, 0 calc(100% - 8px)); }
  .stat .k { font: 700 11px/1 var(--mono); letter-spacing: .08em; color: var(--muted); }
  .stat .v { font: 600 22px/1.2 var(--ui); color: var(--teal); font-variant-numeric: tabular-nums; }
  .stat .f { font-size: 12px; color: var(--muted); }

  .slots { display: grid; gap: 8px; }
  .slots label { grid-template-columns: 2.2rem minmax(0, 1fr); align-items: center; font: 600 15px var(--ui); color: var(--muted); }

  .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; }
  .btn {
    font: 700 12.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; border: 0;
    padding: 12px 20px; background: var(--ink); color: var(--text); clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
    transition: background-color .15s ease-out;
  }
  .btn:hover { background: #2F3A5A; }
  .btn.primary { background: var(--gold); color: var(--ground); }
  .btn.primary:hover { background: #F6CF6C; }
  .btn:disabled { opacity: .4; cursor: default; }

  .steps .left { font-size: 10px; padding: 2px 5px; margin-left: 4px; background: var(--gold); color: var(--ground); }
  .steps button[aria-current="step"] .left { background: var(--ground); color: var(--gold); }
  .count { justify-self: end; font-variant-numeric: tabular-nums; }
  .pool.warn b, .pool.warn { color: var(--gold); }
  .link { font: inherit; color: var(--gold); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .items { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
  .items legend { font: italic 17px/1.2 var(--caption); padding: 0; margin-bottom: 2px; }
  .items small { font-size: 13px; color: var(--muted); }
  .item { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr) auto; gap: 6px; }
  @media (max-width: 520px) { .item { grid-template-columns: minmax(0, 1fr) auto; } .item [data-f="desc"] { grid-column: 1; grid-row: 2; } }
  .item .remove { width: 40px; font: 600 20px/1 var(--ui); color: var(--muted); background: var(--ink); border: 1px solid var(--line); cursor: pointer; }
  .item .remove:hover { color: var(--error); }
  .items .btn { justify-self: start; }
  .finish { display: grid; gap: 16px; }
  .checks { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; }
  .checks li::before { content: "\2022  "; color: var(--gold); }
  .checks li.ok::before { color: var(--teal); }
  .code { font: 13px/1.4 var(--mono); font-weight: 700; color: var(--teal); background: var(--ground); border: 1px solid var(--line);
          width: 100%; min-height: 96px; padding: 10px; word-break: break-all; resize: vertical; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .status { font-size: 14px; color: var(--teal); min-height: 1.4em; }
  .status.err { color: var(--error); }
  .howto { margin: 0; padding-left: 1.2em; color: var(--muted); font-size: 14px; display: grid; gap: 4px; }
  .howto b { color: var(--text); }
  details summary { cursor: pointer; font: italic 17px var(--caption); }

  /* preview */
  .preview { position: sticky; top: max(12px, env(safe-area-inset-top, 0px)); min-width: 0; }
  .preview-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .preview-head span { font: italic 17px var(--caption); color: var(--muted); }
  .frame { background: linear-gradient(#2A3352, #1B2134); padding: 9px; clip-path: polygon(22px 0, calc(100% - 22px) 0, 100% 22px, 100% calc(100% - 22px), calc(100% - 22px) 100%, 22px 100%, 0 calc(100% - 22px), 0 22px); filter: drop-shadow(0 8px 18px rgba(5, 8, 15, .5)); }
  .frame svg { display: block; width: 100%; height: auto; outline: 2px solid rgba(242, 193, 78, .85); outline-offset: -2px; }
  .pagetabs { display: flex; gap: 6px; }
  .pagetabs button { font: 700 11.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; border: 0; cursor: pointer; padding: 8px 14px; background: var(--ink); color: var(--text); }
  .pagetabs button[aria-pressed="true"] { background: var(--gold); color: var(--ground); }
  .wrap { line-height: 1.22; overflow: hidden; white-space: pre-wrap; overflow-wrap: break-word; }
  .wrap.clip { -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }

  /* narrow screens: the sheet comes first (smaller, not sticky) so edits are visible, and the step pills scroll in one row */
  @media (max-width: 1040px) {
    .preview { position: static; order: -1; max-width: 640px; width: 100%; justify-self: center; }
  }
  @media (max-width: 640px) {
    .steps { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .steps::-webkit-scrollbar { display: none; }
    .steps li { flex: none; }
    .forge { padding: 18px 14px 14px; }
    .top .row { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div>
    <div class="wordmark">World of Dissonance</div>
    <h1>Character Maker</h1>
  </div>
  <div class="row">
    <div class="example" id="example" hidden>
      <span>Showing an example character, <b>S-13</b>.</span>
      <button class="btn" id="fresh" type="button">Start fresh</button>
    </div>
    <button class="btn" id="newchar" type="button">New character</button>
    <div class="example confirm" id="newconfirm" role="group" aria-label="Start a new character" hidden>
      <span>Start over? This clears the current character.</span>
      <button class="btn primary" id="newyes" type="button">Clear and start</button>
      <button class="btn" id="newno" type="button">Keep editing</button>
    </div>
  </div>
</header>

<main class="desk">
  <section class="forge" aria-label="Character questions">
    <nav aria-label="Character steps"><ol class="steps" id="steps"></ol></nav>
    <div id="step"></div>
    <div class="nav">
      <button class="btn" id="back" type="button">Back</button>
      <button class="btn primary" id="next" type="button">Next</button>
    </div>
  </section>
  <aside class="preview" aria-label="Sheet preview">
    <div class="preview-head">
      <span>Your sheet, as it will look in game</span>
      <div class="pagetabs" id="pagetabs"></div>
    </div>
    <div class="frame"><svg id="sheet" viewBox="0 0 1000 630" role="img" aria-label="Character sheet preview"></svg></div>
  </aside>
</main>

  "ability": "[The Breathing Mantle]\n[PROTO-LINK]: Being specially designed for the purpose of acting as a conduit for massive amounts of energy. This user is capable of using their own soul to directly connect to another within a 30 foot radius. Starting out this user has three charges of [PROTO-LINK] per long rest.\n[2 EP] If connected to an Ally, the [PROTO-LINK] allows any [Vital Arcana], touch based or otherwise, to be used at a distance equal to the radius.\n[4 EP] If connected to a Foe, the [PROTO-LINK] allows the user to siphon 1d8 HP automatically, and absorb or redirect it to an ally within 30 feet.\nThis user feels a deep kinship with the flow of life through an environment, and finds themselves drawn to it. They receive advantage on nature based Essence rolls. While exploring they can quickly learn and connect with the local biosphere, allowing them one free [PROTO-LINK] attempt per rest without expending any extra EP.",
  "animus": "A deep connection with the current environment and situation that feels almost physical. Wanting to “understand” the cycle of life and all that participate in it. “Powering down” can feel like distancing herself and feel isolating. S-13 seeming to act more primal and animalistic than usual under extreme extension of abilities. Greater chance of lashing out/getting more emotional than usual, mimicking volatile nature of abilities.",
  "affix": "Collection of crystalized rocks, shells, and scales on skin. Jut out at concentrations of high essence (spinal cord). Subtle and slow warping of the body over years to grow taller, larger, and sharper with extended storage and usage of essence on self instead of others. Bright ambient glow when using essence abilities that varies in color depending on the effect of the ability.",
  "afflatus": "Beams of light that erupt from various points on the body, like a solar flare bursting forth. Looks like wisps of illuminated mist are drawn in from the environment and “absorbed” into the spines on the back, glowing brighter as they collect. Shooting forth a beam to “attack”, connecting silky strings of light to “heal/connect”. Can also manifest as mutating, physical crystal prisms being built from the body, as if regenerating something that was always supposed to be there.",
  "gender": "female",
  "height": "6'",
  "weight": "92 kg",
  "age": "25",
  "backstory": "Tells others she's a Si'Kure and just really shy about showing her body because she has a massive scar. Tells others she's been living with her blacksmith father in Lychgate ever since her mother passed. She's been reclusively living in Lychgate for some time now and helping her father with the shop.",
  "skills": "1. TBD\n2. TBD\n3. TBD\n4. TBD\n5. TBD",
  "unlocked": "BALANCE:\nOrder → Pure → Vital"
}

  "base": 1,
  "free": 3,
  "skillSlots": 5,
  "baseTrees": 2,
  "races": [
    {
      "id": "zera_yara", "name": "Zera'Yara",
      "about": "The Seeds of Tantalos: rarely seen ancients whose naturalistic forms resemble the flora of their environment. Many Fraeylings revere old Yara as spirit guides or ancestors.",
      "variants": [
        { "id": "yael", "name": "Yael'Yara", "bonus": { "essence": 2, "shell": 1 },
          "about": "Floral, tree and vine-like, often shaped like terrestrial dinosaurs and drakes. Shapers of soil and all that grows from it; their bodies passively gather essence." },
        { "id": "mara", "name": "Mara'Yara", "bonus": { "essence": 2, "core": 1 },
          "about": "Elusive sea-faring carnivores with fungal and fishy features. Eaters of decay who break anything down into true world clay." },
        { "id": "aek", "name": "A.E.K.", "bonus": { "essence": 3 },
          "about": "Artificial Eon-Kin: the rarest and most profane Yara, mutated for unrivaled control of the three aspects, often crystalline. A star that burns brightest burns out fastest." }
      ]
    },
    {
      "id": "askerahn", "name": "Askerahn",
      "about": "An insectoid people descended from an extraplanar Super-Hive and their goddess-mother Eyiserah. Once shapers of empires; now chasing what they lost.",
      "variants": [
        { "id": "corebound", "name": "The Corebound", "bonus": { "core": 3 }, "about": "A current-day caste of the Core." },
        { "id": "meddelings", "name": "The Meddelings", "bonus": { "essence": 2, "core": 1 }, "about": "A current-day caste of Essence." },
        { "id": "forsaken", "name": "The Forsaken", "bonus": { "shell": 2, "essence": 1 }, "about": "A current-day caste of the Shell." }
      ]
    },
    {
      "id": "daemon", "name": "Daemon",
      "about": "Animated beings made by another through Aspect Manipulation, each born with a purpose. A Daemon that breaks its binds and gains free will becomes an Automa.",
      "variants": [
        { "id": "terranica", "name": "Terranica", "bonus": { "essence": 2 }, "any": 1, "about": "Golems and gargoyles of purely natural materials: plants, stone, water." },
        { "id": "mechanica", "name": "Mechanica", "bonus": { "essence": 2 }, "any": 1, "about": "Mechanical constructs of wood, metal or glass." },

        { "id": "ichorinca", "name": "Ichorinca", "bonus": { "essence": 2 }, "any": 1, "about": "Spirits, conjured or bound souls, concept Daemons." }

    {
      "id": "fraeyling", "name": "Fraeyling", "variantPrompt": "Animal heritage (e.g. Canine, Avian, Feline)",

    },
    {
      "id": "peraxian", "name": "Peraxian", "variantPrompt": "Lineage or motif (optional)",
      "about": "Mechanically minded, precise in arcane engineering, with avian mutations. They mourn the starlit skies they once read their lives by.",
      "variants": [ { "id": "peraxian", "name": "Peraxian", "bonus": { "core": 2, "essence": 1 } } ]
    },
    {
      "id": "sikure", "name": "Si'Kure", "variantPrompt": "Heritage (optional)",
      "about": "Reptilian to draconic people, anywhere from near-humanoid to monstrous depending on how strong their heritage is.",

    {
      "id": "mudsung", "name": "Mud-Sung", "variantPrompt": "Affix-mutation (optional)",
      "about": "Humans: short-lived, with the most malleable souls of all, like clay. Prone to hereditary Affix-mutations; over half are polydactyl.",
      "variants": [ { "id": "mudsung", "name": "Mud-Sung", "bonus": {}, "any": 3 } ]
    },
    {
      "id": "amalgam", "name": "Amalgam", "variantPrompt": "Host or form (optional)",

      "id": "dredge", "name": "Dredge", "variantPrompt": "Original species (optional)", "pending": true,

<script id="glossary" type="application/json">
{
  "_doc": "Hover-tooltip text, keyed by lowercase term. Condensed from the World of Dissonance worldbuilding doc unless marked (placeholder). layout.json 'tip' lists which keys a panel or text shows; {keys} are filled from character.json first, so a value like the species can look itself up.",

  "name": { "title": "Name", "body": "What the world knows this character as." },
  "species": { "title": "Species", "body": "The character's race. Every aspect starts at +1; each race adds a +3 spread on top, plus 3 points to spend freely." },
  "a.e.k.": { "title": "A.E.K. | Artificial Eon-Kin", "body": "A Zera'Yara precisely and excruciatingly mutated for a control over the three aspects often unrivaled. That strength is not made for a mortal body: one misuse could cause a catastrophic failure. Most never learn their abilities and serve the Corebound as living essence batteries. Racial spread: +3 Essence." },
  "variant": { "title": "Variant", "body": "The lineage within a species. Variants can shift the racial spread, e.g. Mara'Yara: +2 Essence, +1 Core." },
  "portrait": { "title": "Portrait", "body": "Character art goes here. (placeholder: uploads come with the backend)" },

  "hp": { "title": "HP | Health Points", "body": "How much damage you can take before you break. An attack that beats your AP hits your HP; at 0 or below you fall unconscious. From Essence: the first point gives 6 HP, every point after +4." },
  "temp hp": { "title": "Temp HP", "body": "A temporary buffer spent before your HP. Some effects bypass it." },
  "ep": { "title": "EP | Energy Points", "body": "How you use your Arcana skills: most cost EP. From Essence: the first point gives 4 EP, every point after +2. Defending recovers 2d4 EP." },
  "ap": { "title": "AP | Armor Points", "body": "Decides whether an attack lands: a d20 attack roll must beat your total AP. Base 10, +1 for every 2 points of Shell, stacking with armor. Defending grants +4 AP until your next turn." },
  "mp": { "title": "MP | Movement Points", "body": "How many cells/blocks you can move per turn. Base 30 feet (7 blocks), +5 feet for every 4 points of Shell. Dashing doubles it." },
  "initiative": { "title": "Initiative", "body": "Your place in the turn order. Core gives +1 for every 2 points (base +0)." },
  "bonuses": { "title": "Bonuses", "body": "Situational bonuses from gear, skills and effects. (placeholder)" },
  "clothes": { "title": "Clothes", "body": "What the character wears day to day. (placeholder)" },
  "armor": { "title": "Armor", "body": "Worn protection. Armor's AP stacks with the bonus from Shell." },
  "gear": { "title": "Gear", "body": "Weapons, tools and other carried equipment. (placeholder)" },

  "attribute": { "title": "Attributes | The Three Aspects", "body": "Every soul is made of three aspects: Core (the mind), Shell (the body) and Essence (the energy that binds them). Each starts at +1, plus your racial +3 and 3 points to spend." },
  "score": { "title": "Score", "body": "Points invested in this aspect. Raised by level-up stat points and by Refinement training." },
  "modifier": { "title": "Modifier", "body": "The bonus this aspect adds to your rolls. (placeholder: not yet defined in the rules doc)" },
  "training xp": { "title": "Training XP", "body": "Each aspect has its own training pool. Train an aspect during a long rest and roll 1d100: a 1 earns nothing and strains the aspect (-1 until the next long rest); a 100 doubles to 200. Thresholds: 80, 250, 500, 650, 800 (+1d100 per training), 1000, 1500 ... 10000." },
  "core": { "title": "Core | Animus", "body": "The spark of sentience at the center of every thinking creature: the mind, and the source of [Will] abilities. Tiers: Minor, Medium, Major, Majestic and Mythic. Affects Initiative: +1 for every 2 points." },
  "shell": { "title": "Shell | Affix", "body": "What physically anchors a being to its realm: its body and form, the source of [Weapon] abilities. Types: Material, Monstrous, Mirrored, Mineral and Majestic. Every 4 points: +5 feet of movement. Every 2 points: +1 AP." },
  "essence": { "title": "Essence | Afflatus", "body": "The energy that binds the aspects, the source of [Wonder] abilities. Types: Memory, Material, Mayhem, Median and Majestic. Gives HP (6, then +4 per point) and EP (4, then +2 per point)." },

  "inventory": { "title": "Inventory", "body": "What the character carries. Hover an item for details." },
  "arcana trees": { "title": "Arcana Trees", "body": "The skill trees this character draws Arcana from. New trees open at levels 5, 10, 15, 20, 25 and 30." },
  "balance": { "title": "Balance | [Essence] [Wonder] [Eternum]", "body": "Main path: Order → Chaos → Median. Branches: Null (Void → Block → Despair), Link (Soul → Siphon → Supplement), Existence (Sway → Soothe → Summon) and Pure (Vital → Flow → Rejoice)." },
  "order → pure → vital": { "title": "Order → Pure → Vital", "body": "Balance's first main-path tier (Order), branching into Pure. Vital #1, Help is on the way!: touch a target to heal 1d6 HP or restore 1d4 EP. 0 EP, instant." },
  "unassigned": { "title": "Open tree slot", "body": "No Arcana tree assigned yet." },
  "signature": { "title": "Signature", "body": "The unique expression of a soul: its Animus, Affix, Afflatus and Ability. Advances at levels 9, 14, 19, 24 and 29." },
  "ability": { "title": "Ability", "body": "The combination of all that is the person's signature. It varies widely between people, but always represents the true nature of their soul." },
  "animus": { "title": "Animus", "body": "The signature spark that represents a being's personalized abilities and magic." },
  "affix": { "title": "Affix", "body": "The paint on the canvas: what makes their body who they are, and their style." },

  "character data": { "title": "Character Data", "body": "Physical details of the character." },
  "backstory": { "title": "Backstory", "body": "Who they were before the story began, and what they tell others." },
  "skill slots": { "title": "Skill Slots", "body": "Equipped Arcana skills. 5 at character creation, +1 on many level-ups (15 at most). Skills can be reslotted at levels 3, 6, 9, 12, 15 ..." },

const ASPECT_NAME = { core: 'Core', shell: 'Shell', essence: 'Essence' };
document.documentElement.style.setProperty('--swirls', `url(${IMAGES[L.background]})`);

// ---------- state ----------
const blank = () => ({
  name: '', gender: '', height: '', weight: '', age: '',
  race: '', variant: '', variantText: '',
  any: { core: 0, shell: 0, essence: 0 }, free: { core: 0, shell: 0, essence: 0 },
  sigTitle: '', ability: '', animus: '', affix: '', afflatus: '',
  trees: [], skills: ['', '', '', '', ''],
  items: [], clothes: '', armor: '', gear: '', bonuses: '', backstory: '',
});
/** Tooltip key the game uses for an inventory line (SheetLayout.tipKey): lowercase, single spaces. */
const itemKey = name => name.trim().replace(/\s+/g, ' ').toLowerCase();
const example = () => Object.assign(blank(), {
  name: EXAMPLE.name, gender: EXAMPLE.gender, height: EXAMPLE.height, weight: EXAMPLE.weight, age: EXAMPLE.age,
  race: 'zera_yara', variant: 'aek', free: { core: 1, shell: 1, essence: 1 },
  sigTitle: EXAMPLE.signature.replace(/[“”"]/g, ''), ability: EXAMPLE.ability, animus: EXAMPLE.animus,
  affix: EXAMPLE.affix, afflatus: EXAMPLE.afflatus, trees: ['balance'],
  items: EXAMPLE.inventory.split('\n').map(s => s.replace(/^- /, '')).map(name => ({ name, desc: (EXAMPLE.item_details?.[itemKey(name)]?.body || '').replace(/ \(placeholder\)$/, '') })),
  clothes: EXAMPLE.clothes, armor: EXAMPLE.armor, gear: EXAMPLE.gear, backstory: EXAMPLE.backstory, isExample: true,
});
/** Older drafts and codes kept the inventory as one text block. */
const upgrade = s => {
  const out = Object.assign(blank(), s);
  if (!Array.isArray(out.items)) out.items = [];
  if (typeof s.inventory === 'string' && !out.items.length) out.items = s.inventory.split('\n').map(x => x.trim()).filter(Boolean).map(name => ({ name, desc: '' }));
  delete out.inventory;
  return out;
};
/** Character limits; the game import drops any value over 6000 characters, so everything stays well under. */
const LIMITS = { name: 60, gender: 30, age: 20, height: 20, weight: 20, variantText: 60, sigTitle: 80, ability: 3000, animus: 1500,
  affix: 1500, afflatus: 1500, clothes: 200, armor: 200, gear: 200, bonuses: 200, backstory: 3000, skill: 60, itemName: 60, itemDesc: 300 };
const MAX_ITEMS = 30;
const DRAFT = 'wod-creator-draft';
let S = (() => { try { const d = JSON.parse(localStorage.getItem(DRAFT)); if (d && d.v === 1) return upgrade(d.s); } catch (e) {} return example(); })();
let stepIndex = 0, sheetPage = 0;
const save = () => { try { localStorage.setItem(DRAFT, JSON.stringify({ v: 1, s: S })); } catch (e) {} };

// ---------- rules ----------
const race = () => R.races.find(r => r.id === S.race);
const variant = () => { const r = race(); return r ? (r.variants.find(v => v.id === S.variant) || r.variants[0]) : null; };
const sum = o => ASPECTS.reduce((a, k) => a + (o[k] || 0), 0);
const anyPoints = () => (variant()?.any || 0);
function scores() {
  const v = variant(), out = {};
  for (const a of ASPECTS) out[a] = R.base + (v?.bonus[a] || 0) + (S.any[a] || 0) + (S.free[a] || 0);
  return out;
}
/** Derived stats, straight from the rules doc (they reproduce S-13's printed sheet exactly). */
function stats() {
  const s = scores();
  return {
    hp: 6 + 4 * (s.essence - 1), ep: 4 + 2 * (s.essence - 1),
    ap: 10 + Math.floor(s.shell / 2), mp: 30 + 5 * Math.floor(s.shell / 4),
    init: Math.floor(s.core / 2), mod: a => Math.floor(s[a] / 2), s,
  };
}
const signed = n => (n >= 0 ? '+' : '') + n;
const spread = v => {
  const parts = ASPECTS.filter(a => v.bonus[a]).map(a => `+${v.bonus[a]} ${ASPECT_NAME[a]}`);
  if (v.any) parts.push(`+${v.any} any`);
  return parts;
};

/** The sheet's character data (same keys as assets/wod_charsheet/sheet/character.json), as the game reads it. */
function character() {
  const st = stats(), r = race(), v = variant(), trees = S.trees.map(id => R.trees.find(t => t.id === id)).filter(Boolean);
  const many = r && r.variants.length > 1;
  const c = {
    v: 1,
    name: S.name.trim(), species: r ? r.name : '', variant: many ? v.name : S.variantText.trim(),
    hp: String(st.hp), hp_max: String(st.hp), temp_hp: '', ep: String(st.ep), ep_max: String(st.ep),
    ap: String(st.ap), mp: String(st.mp), initiative: signed(st.init),
    bonuses: S.bonuses.trim(), clothes: S.clothes.trim(), armor: S.armor.trim(), gear: S.gear.trim(),
    inventory: S.items.filter(i => i.name.trim()).map(i => '- ' + i.name.trim()).join('\n'),
    // per-item tooltips in game (character.json item_details), keyed the way the game normalises a list line
    item_details: Object.fromEntries(S.items.filter(i => i.name.trim() && i.desc.trim()).map(i => [itemKey(i.name), { title: i.name.trim(), body: i.desc.trim() }])),
    bt1: trees[0]?.name || '', bt2: trees[1]?.name || '',
    signature: S.sigTitle.trim() ? `“${S.sigTitle.trim()}”` : '',
    ability: S.ability.trim(), animus: S.animus.trim(), affix: S.affix.trim(), afflatus: S.afflatus.trim(),
    gender: S.gender.trim(), height: S.height.trim(), weight: S.weight.trim(), age: S.age.trim(),
    backstory: S.backstory.trim(),
    skills: S.skills.map((s, i) => `${i + 1}. ${s.trim() || 'TBD'}`).join('\n'),
    unlocked: trees.map(t => `${t.name.toUpperCase()}:\n${t.path[0]}`).join('\n'),
  };
  for (const a of ASPECTS) {
    c[a + '_score'] = String(st.s[a]);
    c[a + '_mod'] = signed(st.mod(a));
    c[a + '_xp'] = '0';
  }
  c._creator = { ...S, isExample: undefined }; // lets the code be loaded back here for editing; the game ignores it
  return c;
}

// ---------- steps ----------
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const field = (id, label, opts = {}) => {
  const v = esc(S[id] ?? ''), max = LIMITS[id];
  const ph = opts.ph ? ` placeholder="${esc(opts.ph)}"` : '';
  const ml = max ? ` maxlength="${max}"` : '';
  const input = opts.area ? `<textarea id="f-${id}" data-k="${id}"${ph}${ml} rows="${opts.rows || 4}">${v}</textarea>`
    : `<input type="text" id="f-${id}" data-k="${id}" value="${v}"${ph}${ml} autocomplete="off">`;
  // long fields show how much room is left, so nothing gets cut off on the way into the game
  const count = opts.area && max ? `<small class="count" id="c-${id}" aria-live="polite">${(S[id] || '').length} / ${max}</small>` : '';
  return `<label class="${opts.wide ? 'wide' : ''}">${esc(label)}${opts.hint ? `<small>${esc(opts.hint)}</small>` : ''}${input}${count}</label>`;
};
const radioCards = (label, items) => `<div class="cards" role="radiogroup" aria-label="${esc(label)}">${items}</div>`;
const def = k => G[k]?.body || '';

const STEPS = [
  { id: 'identity', label: 'Identity', done: () => !!S.name.trim(), render: () => `
    <h2>Who are they?</h2>
    <p class="lede">The name and physical details on the Character Data panel.</p>
    <div class="fields">
      ${field('name', 'Name', { wide: true, ph: 'S-13' })}

      ${field('age', 'Age', { ph: '25' })}
      ${field('height', 'Height', { ph: "6'" })}
      ${field('weight', 'Weight', { ph: '92 kg' })}
    </div>` },
  { id: 'race', label: 'Race', done: () => !!race(), render: () => `
    <h2>Choose a race</h2>
    <p class="lede">Every aspect starts at +1. Your race adds a +3 spread on top; you'll pick a variant next.</p>
    ${radioCards('Race', R.races.map((r, i) => {

  { id: 'variant', label: 'Variant', done: () => !!race(), render: () => {

    if (r.variants.length > 1) return `

  { id: 'aspects', label: 'Aspects', done: () => sum(S.free) === R.free && sum(S.any) === anyPoints(), render: () => {
    const v = variant(), st = stats(), anyLeft = anyPoints() - sum(S.any), freeLeft = R.free - sum(S.free);
    const stepper = (pool, a, left) => `<span class="stepper">

    return `
      <h2>The three aspects</h2>
      <p class="lede">Core is the mind, Shell the body, Essence the energy that binds them. Spend your ${R.free} free points.</p>
      <table class="aspects">
        <thead><tr><th scope="col"></th>${ASPECTS.map(a => `<th scope="col">${ASPECT_NAME[a]}</th>`).join('')}</tr></thead>
        <tbody>
          <tr><td>Base</td>${ASPECTS.map(() => `<td>${R.base}</td>`).join('')}</tr>
          <tr><td>${esc(v ? v.name : 'Race')}</td>${ASPECTS.map(a => `<td>${v?.bonus[a] ? '+' + v.bonus[a] : '&ndash;'}</td>`).join('')}</tr>
          ${anyPoints() ? `<tr><td>Racial, any</td>${ASPECTS.map(a => `<td>${stepper('any', a, anyLeft)}</td>`).join('')}</tr>` : ''}
          <tr><td>Free points</td>${ASPECTS.map(a => `<td>${stepper('free', a, freeLeft)}</td>`).join('')}</tr>
          <tr class="total"><td>Score</td>${ASPECTS.map(a => `<td>${st.s[a]}</td>`).join('')}</tr>

        </tbody>

        Modifier is score &divide; 2, rounded down (a placeholder: the rules doc doesn't define it yet).</p>
      <div class="derived">
        <div class="stat"><div class="k">HP</div><div class="v">${st.hp}</div><div class="f">6, +4 per Essence after the first</div></div>
        <div class="stat"><div class="k">EP</div><div class="v">${st.ep}</div><div class="f">4, +2 per Essence after the first</div></div>
        <div class="stat"><div class="k">AP</div><div class="v">${st.ap}</div><div class="f">10, +1 per 2 Shell</div></div>
        <div class="stat"><div class="k">MP</div><div class="v">${st.mp} ft</div><div class="f">30 ft, +5 per 4 Shell</div></div>
        <div class="stat"><div class="k">INITIATIVE</div><div class="v">${signed(st.init)}</div><div class="f">+1 per 2 Core</div></div>
      </div>`;
  } },
  { id: 'signature', label: 'Signature', done: () => !!(S.ability.trim() || S.animus.trim()), render: () => `
    <h2>Signature</h2>
    <p class="lede">${esc(def('signature'))}</p>
    <div class="fields">
      ${field('sigTitle', 'Signature title', { wide: true, ph: 'The Finite Divine' })}
      ${field('ability', 'Ability', { wide: true, area: true, rows: 5, hint: def('ability') })}
      ${field('animus', 'Animus', { wide: true, area: true, hint: def('animus') })}
      ${field('affix', 'Affix', { wide: true, area: true, hint: def('affix') })}
      ${field('afflatus', 'Afflatus', { wide: true, area: true, hint: def('afflatus') })}
    </div>` },
  { id: 'arcana', label: 'Arcana', done: () => S.trees.length === R.baseTrees, render: () => `
    <h2>Arcana trees</h2>
    <p class="lede">Choose ${R.baseTrees} base trees. You start at the first tier of each tree's main path.</p>
    <p class="pool" id="treenote" role="status"><b>${S.trees.length} of ${R.baseTrees}</b> chosen.${S.trees.length >= R.baseTrees ? ' To swap one, deselect it first.' : ''}</p>
    <div class="cards" role="group" aria-label="Arcana trees">${R.trees.map(t => `<button type="button" class="card" role="checkbox" data-tree="${t.id}" aria-checked="${S.trees.includes(t.id)}">
      <span class="name">${esc(t.name)}</span>${t.aspect ? `<span class="chips"><span class="chip">${esc(t.aspect)}</span></span>` : ''}
      <span class="path">${t.path.map(esc).join(' &rarr; ')}</span><span class="about">${esc(t.branches)}</span></button>`).join('')}</div>
    <h2 style="margin-top: 22px">Skill slots</h2>
    <p class="lede">You start with ${R.skillSlots}. Leave a slot blank to show it as TBD.</p>
    <div class="slots">${S.skills.map((s, i) => `<label for="f-skill-${i}">${i + 1}.<input type="text" id="f-skill-${i}" data-skill="${i}" value="${esc(s)}" maxlength="${LIMITS.skill}" placeholder="TBD" autocomplete="off"></label>`).join('')}</div>` },
  { id: 'story', label: 'Kit & story', done: () => !!S.backstory.trim(), render: () => `
    <h2>Kit and story</h2>
    <p class="lede">What they carry and where they come from.</p>
    <div class="fields">
      <fieldset class="items wide">
        <legend>Inventory</legend>
        <small>A description is optional; in game it shows when you hover the item.</small>
        ${S.items.map((it, i) => `<div class="item">
          <input type="text" id="f-item-${i}" data-item="${i}" data-f="name" value="${esc(it.name)}" maxlength="${LIMITS.itemName}" placeholder="Item" aria-label="Item ${i + 1} name" autocomplete="off">
          <input type="text" id="f-itemd-${i}" data-item="${i}" data-f="desc" value="${esc(it.desc)}" maxlength="${LIMITS.itemDesc}" placeholder="Description (optional)" aria-label="Item ${i + 1} description" autocomplete="off">
          <button type="button" class="remove" data-remove="${i}" aria-label="Remove ${esc(it.name || 'item ' + (i + 1))}">&times;</button></div>`).join('')}
        <button type="button" class="btn" id="additem" ${S.items.length >= MAX_ITEMS ? 'disabled' : ''}>Add item</button>
      </fieldset>
      ${field('clothes', 'Clothes', { wide: true })}
      ${field('armor', 'Armor')}
      ${field('gear', 'Gear')}
      ${field('bonuses', 'Bonuses', { wide: true, hint: 'Situational bonuses from gear or effects, if any.' })}
      ${field('backstory', 'Backstory', { wide: true, area: true, rows: 6 })}
    </div>` },
  { id: 'finish', label: 'Finish', done: () => false, render: () => {
    const step = id => STEPS.findIndex(s => s.id === id);
    const checks = [
      [!!S.name.trim(), 'Name filled in', 'identity'], [!!race(), 'Race chosen', 'race'],
      [sum(S.free) === R.free, `All ${R.free} free points spent`, 'aspects'], [sum(S.any) === anyPoints(), 'Racial points placed', 'aspects'],
      [S.trees.length === R.baseTrees, `${R.baseTrees} Arcana trees chosen`, 'arcana'],
    ];
    const named = !!S.name.trim();
    return `
      <h2>Your sheet</h2>
      <p class="lede">Download a fillable PDF, or copy a code to import this character into the game.</p>
      <div class="finish">
        <ul class="checks">${checks.map(([ok, t, id]) => `<li class="${ok ? 'ok' : ''}">${ok ? esc(t) : `<button type="button" class="link" data-step="${step(id)}">${esc(t)} (not yet)</button>`}</li>`).join('')}</ul>
        ${named ? '' : `<p class="pool">The game needs a name before it will import a character. <button type="button" class="link" data-step="${step('identity')}">Add a name</button></p>`}
        <div class="row"><button class="btn primary" id="pdf" type="button" ${named ? '' : 'disabled'}>Download fillable PDF</button>
          <button class="btn" id="copy" type="button" ${named ? '' : 'disabled'}>Copy import code</button></div>
        <div class="status" id="status" role="status"></div>
        <textarea class="code" id="code" readonly aria-label="Import code" ${named ? '' : 'hidden'}>Building code&hellip;</textarea>
        <ol class="howto">
          <li>Copy the code above.</li>
          <li>In Minecraft, press <b>K</b> to open your character sheet.</li>
          <li>Click <b>Import code</b> under the sheet. It reads the code from your clipboard.</li>
        </ol>
        <details>
          <summary>Edit a character from a code</summary>
          <div class="finish" style="margin-top: 10px">
            <textarea class="code" id="loadcode" placeholder="Paste a WOD1- code here" aria-label="Code to load"></textarea>
            <div class="row"><button class="btn" id="load" type="button">Load into the maker</button></div>
          </div>
        </details>
      </div>`;
  } },
];

const stepsEl = document.getElementById('steps'), stepEl = document.getElementById('step');
const pointsLeft = () => R.free - sum(S.free) + anyPoints() - sum(S.any);
function renderSteps() {
  stepsEl.innerHTML = STEPS.map((s, i) => {
    const left = s.id === 'aspects' && race() ? pointsLeft() : 0; // unspent points show on the pill itself
    return `<li><button type="button" data-step="${i}" ${i === stepIndex ? 'aria-current="step"' : ''} class="${s.done() ? 'done' : ''}">${esc(s.label)}${left ? ` <span class="left">${left} left</span>` : ''}</button></li>`;
  }).join('');
  stepsEl.querySelector('[aria-current]')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  document.getElementById('back').disabled = stepIndex === 0;
  document.getElementById('next').hidden = stepIndex === STEPS.length - 1;
  document.getElementById('example').hidden = !S.isExample;
  document.getElementById('newchar').hidden = !!S.isExample || !document.getElementById('newconfirm').hidden;
}
function renderStep() {
  stepEl.innerHTML = `<div class="step">${STEPS[stepIndex].render()}</div>`;
  renderSteps();
  if (STEPS[stepIndex].id === 'finish' && S.name.trim()) refreshCode();
}
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function go(i) {
  stepIndex = Math.max(0, Math.min(STEPS.length - 1, i));
  renderStep();
  // a long step left you scrolled down; bring the new step's top into view (matters most on phones)
  const forge = document.querySelector('.forge');
  if (forge.getBoundingClientRect().top < 0) forge.scrollIntoView({ block: 'start', behavior: reduceMotion ? 'auto' : 'smooth' });
  (stepEl.querySelector('[role=radio][tabindex="0"]') || stepEl.querySelector('input, textarea, button'))?.focus({ preventScroll: true });
}
let previewTimer;
function changed(rerender) {
  if (S.isExample) { S.isExample = false; }
  save();
  if (rerender) renderStep(); else renderSteps();
  clearTimeout(previewTimer);
  previewTimer = setTimeout(renderPreview, 120);
}
/** Re-render a step but keep keyboard focus on the same control (cards, steppers, item rows). */
function rerenderKeepingFocus() {
  const a = document.activeElement, sel = a?.id ? '#' + CSS.escape(a.id) : a?.dataset.race ? `[data-race="${a.dataset.race}"]` : a?.dataset.variant ? `[data-variant="${a.dataset.variant}"]`
    : a?.dataset.tree ? `[data-tree="${a.dataset.tree}"]` : a?.dataset.pool ? `[data-pool="${a.dataset.pool}"][data-a="${a.dataset.a}"][data-d="${a.dataset.d}"]` : null;
  changed(true);
  const el = sel && stepEl.querySelector(sel);
  (el && !el.disabled ? el : stepEl.querySelector(sel?.replace(/\[data-d="[^"]*"\]/, '') || '#none'))?.focus({ preventScroll: true });
}

stepsEl.addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (b) go(+b.dataset.step); });
document.getElementById('back').addEventListener('click', () => go(stepIndex - 1));
document.getElementById('next').addEventListener('click', () => go(stepIndex + 1));
// starting over discards the current character, so it asks first (in the page: the viewer has no confirm dialogs)
const newChar = document.getElementById('newchar'), newConfirm = document.getElementById('newconfirm');
const startOver = () => { S = blank(); stepIndex = 0; save(); renderStep(); renderPreview(); };
newChar.addEventListener('click', () => { newChar.hidden = true; newConfirm.hidden = false; newConfirm.querySelector('button').focus(); });
document.getElementById('newyes').addEventListener('click', () => { newConfirm.hidden = true; newChar.hidden = false; startOver(); go(0); });
document.getElementById('newno').addEventListener('click', () => { newConfirm.hidden = true; newChar.hidden = false; newChar.focus(); });
document.getElementById('fresh').addEventListener('click', () => { startOver(); go(0); }); // the untouched example has nothing to lose
stepEl.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.k) {
    S[t.dataset.k] = t.value; changed(false);
    const c = document.getElementById('c-' + t.dataset.k); if (c) c.textContent = `${t.value.length} / ${LIMITS[t.dataset.k]}`;
  }
  if (t.dataset.skill) { S.skills[+t.dataset.skill] = t.value; changed(false); }
  if (t.dataset.item) { S.items[+t.dataset.item][t.dataset.f] = t.value; changed(false); }
});
stepEl.addEventListener('keydown', e => { // arrow keys move through a radio group, like native radios
  const r = e.target.closest('[role=radio]');
  if (!r || !['ArrowRight', 'ArrowDown', 'ArrowLeft', 'ArrowUp'].includes(e.key)) return;
  e.preventDefault();
