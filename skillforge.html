<script id="forgeglossary" type="application/json">{"yael’yara":{"t":"Yael’Yara","d":"are most known for their floral, tree, and creeping vine-like appearances more often than not appearing like terrestrial dinosaurs and drakes. With intricately woven barks, blooming manes of flowers, teeth as strong as the stone they shape with ease. They hold dominion over the soil and all that grows from it. Shapers…","u":"the-cords-of-tantalos.html#term-yaelyara","p":"The Cords of Tantalos"},"mara’yara":{"t":"Mara’Yara","d":"are rather elusive due to the conditions they require to function. Those that have been witnessed have been reported to appear most commonly like sea faring carnivores of all shapes and sizes. Often of a prehistoric or sea serpent like nature their appearances are commonly a mix of fungal and fishy features. Though…","u":"the-cords-of-tantalos.html#term-marayara","p":"The Cords of Tantalos"},"a.e.k.":{"t":"A.E.K.","d":"The rarest and most profane of the Zera’Yara. There is little known in the world before or now about these strange beings. Even the ancients believe the Artificial Eon-Kin to be merely the attempt of mortal creatures to broach upon the power of something far beyond them. Among these reasons produces the fact that…","u":"the-cords-of-tantalos.html#term-a-e-k","p":"The Cords of Tantalos"},"yael":{"t":"Yael","d":"Flowers, Trees, Bushes, Moss, Cactus, Creepers (Vines) [Terrestrial Creatures, Land Dinosaurs, Drakes]","u":"the-cords-of-tantalos.html#term-yael","p":"The Cords of Tantalos"},"mara":{"t":"Mara","d":"Fungi, Mold, Carnivorous Flora, Lichen, Coral [Carniviourus Aquatic/Amphibian Creatures, Prehistoric Aquatic Creatures, Sea Serpents]","u":"the-cords-of-tantalos.html#term-mara","p":"The Cords of Tantalos"},"the star-blood":{"t":"The Star-Blood","d":"Make up around 5% percent of the total Peraxi population. Consisting of primarily noble Peraxi houses who rely on structured ignorance to hoard the knowledge granted by their heritage and the associated power within their ‘undiluted’ blood. Star-Bloods tend to have very clear and mostly Avian features, including bird…","u":"the-cords-of-tantalos.html#term-the-star-blood","p":"The Cords of Tantalos"},"the luminary":{"t":"The Luminary","d":"Make up around 25% percent of the total Peraxi population. Most care little for their higher ration of ancient Peraxian blood present in their veins. Some families hold shreds of their heritage knowledge while others remain ignorant.Their appearances however remain striking and very remarkable, often a stark mix of…","u":"the-cords-of-tantalos.html#term-the-luminary","p":"The Cords of Tantalos"},"the united":{"t":"The United","d":"Make up around 70% percent of the total Peraxi population. The United have mostly become unknowing of their own pasts and many of their houses have either abandoned or simply were uneducated about their own origins. Purposefully constructed by those who now believe their knowledge should be held by only the Star-Blood…","u":"the-cords-of-tantalos.html#term-the-united","p":"The Cords of Tantalos"},"exalted":{"t":"Exalted","d":"Also once known as the “High Throne” the Exalted Askerahn of days past were considered to be not only the divinely selected rulers of the various hives that once were spread across Tantalos before its fracture, but were considered to be absolute in all actions.","u":"the-cords-of-tantalos.html#term-exalted","p":"The Cords of Tantalos"},"terranica":{"t":"Terranica","d":"Typical Golems, Gargoyles etc Made of purely natural materials (Plants, stone, water, etc.) Mechanica: Robot ( Mechanical Wooden, Metal, Glass constructs of any type) Organinca: Flesh golems, (undead/physically augmented artificial subjects etc) Ichorinca: Spirits, Conjured/Bound Souls, (Concept Daemons)","u":"the-cords-of-tantalos.html#term-terranica","p":"The Cords of Tantalos"},"the yael'yara":{"t":"The Yael'Yara","d":"The first variant of the Zera’Yara includes the Yael. Yael primarily focus most of their ageless lives commanding grand wells of essence to terraform and maintain the biomes they herald as protectors. Requiring forms capable of supporting great feats of strength. The Yael pride themselves on their physical and magical…","u":"simplistic-species-tldr.html#term-the-yaelyara","p":"Simplistic Species TLDR"},"the mara'yara":{"t":"The Mara'Yara","d":"The second variant of the Zera’Yara includes the Mara. Mara primarily focus most of their ageless lives on decomposing exhausted energy sources and dead biomes and creatures in order to provide the land with the nutrients it needs to regrow. Helping fertilize whatever may have once been barren to have the chance at…","u":"simplistic-species-tldr.html#term-the-marayara","p":"Simplistic Species TLDR"},"the a.e.k.":{"t":"The A.E.K.","d":"The third and rarest bastardized form of a Zera’Yarans. A.E.K. are artificially made from either a Yael or Mara sprout or the most unstable, a mix between the two. Their forms are meant to access an extreme amount of essence but even then they remain capable of malfunctioning resulting in catastrophic explosive…","u":"simplistic-species-tldr.html#term-the-a-e-k","p":"Simplistic Species TLDR"},"lux'malka":{"t":"Lux'Malka","d":"- system that contains it all. \"Core\" is the sun that bathes it all in sunlight and brings energy to the system.","u":"astrology-dimensions-demi-planes.html#term-luxmalka","p":"Astrology | Dimensions | Demi-Planes"},"other names":{"t":"Other Names","d":"Malka, Sun, Lux, Center, Core","u":"astrology-dimensions-demi-planes.html#term-other-names","p":"Astrology | Dimensions | Demi-Planes"},"aera'caldera":{"t":"Aera'Caldera","d":"- Gas giant close to the sun, not many moons, pale pink/orange due to heat and \"hot jupiter\" classification. Leaves a small haze behind it of various gasses being blasted off from its atmosphere from the heat. Gasses are blasted out to the outer system, helping populate it all in a wide variety of planetary materials.","u":"astrology-dimensions-demi-planes.html#term-aeracaldera","p":"Astrology | Dimensions | Demi-Planes"},"zera'morana":{"t":"Zera'Morana","d":"- 2nd planet from the sun. THE WoD. Double ringed system caused by half-destruction of one moon.","u":"astrology-dimensions-demi-planes.html#term-zeramorana","p":"Astrology | Dimensions | Demi-Planes"},"zera'confractus":{"t":"Zera'Confractus","d":"- Closer moon, ripped in half. A beautiful shade of pastels and minerals. Small atmosphere reflects light back to Tantalos","u":"astrology-dimensions-demi-planes.html#term-zeraconfractus","p":"Astrology | Dimensions | Demi-Planes"},"zera'speculum":{"t":"Zera'Speculum","d":"- Further moon, smaller. Large collection of ice and glass, giving it a light blue shade. Has a large circular hole blasted through its side causing it to be a literal crescent.","u":"astrology-dimensions-demi-planes.html#term-zeraspeculum","p":"Astrology | Dimensions | Demi-Planes"},"ansa":{"t":"Ansa","d":"- First asteroid belt. more cluttered than our asteroid belt. The location of a planet that's destroyed and reformed endlessly every billion years.","u":"astrology-dimensions-demi-planes.html#term-ansa","p":"Astrology | Dimensions | Demi-Planes"},"ansa'denuo":{"t":"Ansa'Denuo","d":"- New protoplanet currently halfway through \"formation\" stage.","u":"astrology-dimensions-demi-planes.html#term-ansadenuo","p":"Astrology | Dimensions | Demi-Planes"},"hortus'regis":{"t":"Hortus'Regis","d":"- Enormous supersaturn acting as a sort of miniature system in itself. Massive rings stretch 150 times further than Saturn's. Deep orange brown/magenta color. 20 times the size of Jupiter. Helps stabilize a lot of the orbits in the system. Incredibly far out from the rest of the system.","u":"astrology-dimensions-demi-planes.html#term-hortusregis","p":"Astrology | Dimensions | Demi-Planes"},"hortus'progredi":{"t":"Hortus'Progredi","d":"- Water moon, breathable atmosphere, native life remains almost entirely confined to the oceans except for small islands where alien plants live,","u":"astrology-dimensions-demi-planes.html#term-hortusprogredi","p":"Astrology | Dimensions | Demi-Planes"},"hortus'montes":{"t":"Hortus'Montes","d":"- massive rocky moon, no atmosphere, cracks along surface that are mile long canyons, cracking with every orbit. Surface plates are pushed together into space-reaching mountains, casting shadows hundreds of miles long.","u":"astrology-dimensions-demi-planes.html#term-hortusmontes","p":"Astrology | Dimensions | Demi-Planes"},"hortus'vestigia":{"t":"Hortus'Vestigia","d":"- highly elliptical moon that passes through the ring systems, scattering beautiful showers across the atmosphere. Unbelievable colors.","u":"astrology-dimensions-demi-planes.html#term-hortusvestigia","p":"Astrology | Dimensions | Demi-Planes"},"minor":{"t":"Minor","d":"Being the most common type; Minor-Cores are easily found throughout the world; this includes most fauna and flora. Creatures that are clearly alive and have functions but otherwise are incapable of higher levels of comprehension. Their souls are not tampered with, enhanced, and are typically default and rudimentary…","u":"the-three-aspects-astra-fibero-eternum.html#term-minor","p":"The Three Aspects [Astra, Fibero, Eternum]"},"medium":{"t":"Medium","d":"Medium souls are the majority in terms of society based creatures, most species and Vibrae-Kin capable of complex reasoning and learning often have a Medium Tier soul. Being the most common form of core a person would encounter outside of the natural world and minor cores, this tier is baseline for what the modern…","u":"the-three-aspects-astra-fibero-eternum.html#term-medium","p":"The Three Aspects [Astra, Fibero, Eternum]"},"major":{"t":"Major","d":"A Major albeit rare, is not impossible to find. Some beings are born with them, others achieve such by refining their own aspects into greatness, others have it thrust upon them by their creator’s hands in the form of soul-stitching. A cruel process that requires the shattering and melding of multiple lesser cores to…","u":"the-three-aspects-astra-fibero-eternum.html#term-major","p":"The Three Aspects [Astra, Fibero, Eternum]"},"mythic":{"t":"Mythic","d":"Even some of the most educated minds of the world of Tantalos believe this category like most things of ‘Mythos’ to simply represent a power and scale beyond anything they have encountered or recorded in history. While in many ways this can apply, there are more creatures with Mythic Cores than they would want to…","u":"the-three-aspects-astra-fibero-eternum.html#term-mythic","p":"The Three Aspects [Astra, Fibero, Eternum]"},"astra":{"t":"Astra","d":"The weave of energy that acts as the barrier between the various multiversal branches connected to the realm of Tantalos a proverbial interior to the metaphysical binding agent that is [Link] based [Eternum]. This plane from its interior consists of a seemingly endless void of stars. If theoretically one was to…","u":"the-three-aspects-astra-fibero-eternum.html#term-astra","p":"The Three Aspects [Astra, Fibero, Eternum]"},"fibero":{"t":"Fibero","d":"One of the most resistant forms of Essence due to its low but highly concentrated potency. [Fibero] Essence is the quintessential building block for most forms of physical matter across the realms. Nearly akin to a magnetic attractant, [Fibero] is capable of channeling multiple forms of Essence directly into the…","u":"the-three-aspects-astra-fibero-eternum.html#term-fibero","p":"The Three Aspects [Astra, Fibero, Eternum]"},"eternum":{"t":"Eternum","d":"Absolute potential in the form of Arcane Energy. Eternum essence is the basis for all things, even the other forms such as Fibero and Astra. In its unchanged form it is capable of changing and reforming into absolutely anything it requires to keep whatever it binds together. This is required for any and all forms of…","u":"the-three-aspects-astra-fibero-eternum.html#term-eternum","p":"The Three Aspects [Astra, Fibero, Eternum]"},"affix":{"t":"Affix","d":"The paint on the canvas, what makes their body who they are and their style.","u":"signatures-affix-animus-afflauntus-ability.html#term-affix","p":"Signatures [Affix, Animus, Afflauntus, Ability]"},"afflatus":{"t":"Afflatus","d":"The unique light of one’s soul, a reflection of their inner being. The thematic representation of their abilities.","u":"signatures-affix-animus-afflauntus-ability.html#term-afflatus","p":"Signatures [Affix, Animus, Afflauntus, Ability]"},"animus":{"t":"Animus","d":"The signature spark that represents a being’s personalized abilities and/or magic.","u":"signatures-affix-animus-afflauntus-ability.html#term-animus","p":"Signatures [Affix, Animus, Afflauntus, Ability]"},"ability":{"t":"Ability","d":"The combination of all that is the person’s signature. This innate skill widely varies person to person. However one thing remains clear, it always represents the true nature of their soul.","u":"signatures-affix-animus-afflauntus-ability.html#term-ability","p":"Signatures [Affix, Animus, Afflauntus, Ability]"},"unbind":{"t":"UNBIND","d":"Projection -> Precision -> Mock ↗ AFFIXED: Distort -> Construct -> Weave ↗ TRAIT: Enhance -> Defend -> Disgrace ↘ ↘ ↘ RELEASE: Recover -> Redirect -> Rebound BODY: Bulwark -> Break -> Bend","u":"arcana-wonder-will-weapon.html#term-unbind","p":"Arcana [Wonder, Will, Weapon]"},"optimized":{"t":"OPTIMIZED","d":"Practiced -> Poised -> Perfected ↗ TRADITIONAL: Aspire -> Associate-> Anicent ELEMENT: Temper -> Destabilize -> Synergy ↕ ↘ NEW AGE: Ponder -> Thesis -> Invent DESTRUCTION: Components -> Conform -> Convert","u":"arcana-wonder-will-weapon.html#term-optimized","p":"Arcana [Wonder, Will, Weapon]"},"tool":{"t":"TOOL","d":"Trinket -> Talent -> Treasure ↗ ↘ INFUSE: Implement -> Contemplation Hypothesis RELIC: Repurpose -> Ratio -> Ranked ↘ ↗ | BROAD: Balm -> Beneficial -> Brilliant \\/ Grand \\<- Gild \\<- Grasp \\<- Mastery","u":"arcana-wonder-will-weapon.html#term-tool","p":"Arcana [Wonder, Will, Weapon]"},"mirror":{"t":"MIRROR","d":"Mundane -> Magical -> Monsterus ↗ DECEIVE: Mirage -> Confuse -> Provoke -> WARP: Wane -> Will -> Wisp -> SHIFT: Physical -> Mental -> Planar ↘ CHARM: Convince ->Convey -> Connive","u":"arcana-wonder-will-weapon.html#term-mirror","p":"Arcana [Wonder, Will, Weapon]"},"transpose":{"t":"TRANSPOSE","d":"Swap -> Split -> Serve ↗ SHIELD: Armour -> Arments -> Augment ↗ RAMPART: Cover -> Strengthen -> Bastion ↘ FLEX: Boost -> Burden -> Brave ↘ RISK: Gamble -> Gain -> Glory","u":"arcana-wonder-will-weapon.html#term-transpose","p":"Arcana [Wonder, Will, Weapon]"},"harmony":{"t":"HARMONY","d":"-> Unity -> Uplift -> Union -> RESONATE: -> Call -> Compose -> Choir ↗ /\\ VOCAL: Sound -> Song -> Symphony | ↘ \\/ DISSONANCE: Discord -> Detriment -> Disconnect -> ROAR: -> Call -> Convoke -> Cacophony","u":"arcana-wonder-will-weapon.html#term-harmony","p":"Arcana [Wonder, Will, Weapon]"},"core":{"t":"Core","d":"An ability that requires a finely tuned mind to bring to fruition","u":"arcana-wonder-will-weapon.html#term-core","p":"Arcana [Wonder, Will, Weapon]"},"shell":{"t":"Shell","d":"An ability that requires the stalwart strength and speed of the mighty to achieve.","u":"arcana-wonder-will-weapon.html#term-shell","p":"Arcana [Wonder, Will, Weapon]"},"essence":{"t":"Essence","d":"An ability that requires the imagination and emotion of a creative soul to conjure.","u":"arcana-wonder-will-weapon.html#term-essence","p":"Arcana [Wonder, Will, Weapon]"},"instant":{"t":"Instant","d":"Any actions, skills, or items tagged with [Instant] are effects that upon triggered automatically go into effect depending on their descriptions. [Instant] abilities tend to be weaker due to their ability to be casted quickly or sometimes for free.","u":"actions-rolls-combat.html#term-instant","p":"Actions, Rolls, Combat"},"reaction":{"t":"Reaction","d":"Any actions, skills, or items tagged with [Reaction] often have prerequisite requirements in order to be triggered. These requirements can even be met outside of the turn of the player using their [Reaction] . As long as that player did not use their [Reaction] on their turn, they may freely activate that one charge…","u":"actions-rolls-combat.html#term-reaction","p":"Actions, Rolls, Combat"},"primary action":{"t":"Primary Action","d":"Each turn a player has many choices for their [Primary Action] , often most skills or items will specify the amount of [Rounds] it requires for them to take effect. By investing your [Primary Action] into them you are putting your efforts towards bringing it to fruition. The three most actions of this type include:","u":"actions-rolls-combat.html#term-primary-action","p":"Actions, Rolls, Combat"},"duel":{"t":"Duel","d":"Activating any [Arcana Skills] or a [Basic Attack] often fall in this category regardless of the skills and its effects. The [Duel] action is merely the statement of using said [Arcana Skills], [Basic Attack], or their [Signature Ability] and investing their [Primary Action] into such. The [Rounds] requirements in…","u":"actions-rolls-combat.html#term-duel","p":"Actions, Rolls, Combat"},"defend":{"t":"Defend","d":"As a player uses their [Arcana Skills] and [Signature Ability] they will slowly go through their allotment of EP. In order to recharge their energy they may invest their [Primary Action] into [Defending] for the turn. This grants them back an automatic [2d4 EP] unless otherwise specified by another skill, item, or…","u":"actions-rolls-combat.html#term-defend","p":"Actions, Rolls, Combat"},"dash":{"t":"Dash","d":"When all else fails a player may always choose to retreat. If a player invests their [Primary Action] into dashing, they automatically double their MP bonus in any direction they choose. This counts as disengaging the enemy and thus does not trigger an [Attack of Opportunity] . However, the player is unable to…","u":"actions-rolls-combat.html#term-dash","p":"Actions, Rolls, Combat"},"delay":{"t":"Delay","d":"During their turn a player may choose to relinquish their [Primary Action] in favor of a [Delay] . This grants them an automatic [2 EP and 1d6 HP] back as they take their turn tending to themselves quickly. Upon choosing such the player forfeits their ability to trigger any other [Primary Action] until the start of…","u":"actions-rolls-combat.html#term-delay","p":"Actions, Rolls, Combat"},"ready":{"t":"Ready","d":"When weary or becoming aware of an incoming threat not currently visible, a player may invest their [Primary Action] into becoming [Ready] for an immediate response. This makes them immune to being [Surprised] and allows them to immediately trigger the action prepared with [Ready] by using their [Reaction] upon…","u":"actions-rolls-combat.html#term-ready","p":"Actions, Rolls, Combat"},"help":{"t":"Help","d":"Investing their [Primary Action] into assisting another person. A player may use the [Help] action on allies in cells directly adjacent to them to achieve multiple goals. A traditional [Help] action will give the assisted individual [Advantage] on their next roll. The [Help] action can also be used on [Dying]…","u":"actions-rolls-combat.html#term-help","p":"Actions, Rolls, Combat"},"free actions":{"t":"Free Actions","d":"There are a few forms of [Free Action] that can be taken per-turn by a player. The two most common being their Movement and Talking.","u":"actions-rolls-combat.html#term-free-actions","p":"Actions, Rolls, Combat"},"affixed":{"t":"AFFIXED","d":"Distort -> Construct -> Weave ↗ UNBIND: Projection -> Precision -> Mock ↗ TRAIT: Enhance -> Defend -> Disgrace || ↘ || RELEASE: Recover -> Redirect -> Rebound \\/ BODY: Bulwark -> Break -> Bend","u":"skills-skills-and-more-skills.html#term-affixed","p":"Skills, Skills, and MORE SKILLS."},"body":{"t":"Body","d":"Release: Unbind: Affixed:","u":"skills-skills-and-more-skills.html#term-body","p":"Skills, Skills, and MORE SKILLS."},"burning":{"t":"Burning","d":"Target takes 1d4+1 damage at the start of their turn per-stack of Burning. The stack then reduces by one.","u":"elements-effects-conditions.html#term-burning","p":"Elements, Effects, Conditions"},"freezing":{"t":"Freezing","d":"Target receives a -5 MP debuff per-stack of Freezing. The stack reduces by one at the end of the target’s turn.","u":"elements-effects-conditions.html#term-freezing","p":"Elements, Effects, Conditions"},"crushed":{"t":"Crushed","d":"Target receives a -1 AP penalty per-stack of Crushed. The stack reduces by one at the end of the target’s turn.","u":"elements-effects-conditions.html#term-crushed","p":"Elements, Effects, Conditions"},"winded":{"t":"Winded","d":"Target receives a -1 EP debuff per-stack of Winded. This triggers at the start of the target’s turn and reduces the stack by one every round.","u":"elements-effects-conditions.html#term-winded","p":"Elements, Effects, Conditions"},"withered":{"t":"Withered","d":"Target receives a -1 Max HP debuff per-stack of Withered. The stack reduces by one at the end of the Target’s turn.","u":"elements-effects-conditions.html#term-withered","p":"Elements, Effects, Conditions"},"blooming":{"t":"Blooming","d":"Target receives a +1 Max HP buff per-stack of Blooming. The stack reduces by one at the end of the Target’s turn.","u":"elements-effects-conditions.html#term-blooming","p":"Elements, Effects, Conditions"},"melting":{"t":"Melting","d":"Target takes 2 Damage and -2 AP per-stack of Melting at the start of their turn. The stack reduces by one at the end of their turn.","u":"elements-effects-conditions.html#term-melting","p":"Elements, Effects, Conditions"},"shocked":{"t":"Shocked","d":"Target receives a -5 MP and -1 EP per stack of Shocked at the start of their turn. The stack reduces by one at the end of their turn.","u":"elements-effects-conditions.html#term-shocked","p":"Elements, Effects, Conditions"},"confused":{"t":"Confused","d":"Target fumbles to use their next actions, attempting to attack results in a DC 20 Core Check, otherwise they will hit themselves with the damage instead. They may still choose to move or use defense on their turn, but all other actions are prohibited. Stacks of Confusion diminish by one at the end of their turn.","u":"elements-effects-conditions.html#term-confused","p":"Elements, Effects, Conditions"},"frightened":{"t":"Frightened","d":"The target becomes absolutely terrified of the Source or Caster of this effect. For every round Frightened is active they must either make a successful DC 20 Core Check or use their full movement to get away from the source. At the end of their turn one stack of Frightened is removed.","u":"elements-effects-conditions.html#term-frightened","p":"Elements, Effects, Conditions"},"dazed":{"t":"Dazed","d":"A target afflicted with stacks of Dazed finds themselves unable to Defend or Attack. All attacks against others are at disadvantage, and all attacks on the target are at advantage. Stacks of Daze diminish by one at the end of Target’s turn.","u":"elements-effects-conditions.html#term-dazed","p":"Elements, Effects, Conditions"},"charmed":{"t":"Charmed","d":"By having the line blurred between enemy and foe, a Target afflicted with stacks of Charmed will no longer be immediately aggressive to the Source or Caster and their accompanying Allies. This gives the Caster or Source alone advantage as Essence based checks with the afflicted target.","u":"elements-effects-conditions.html#term-charmed","p":"Elements, Effects, Conditions"},"panicked":{"t":"Panicked","d":"Unable to focus on what’s going on, panic sets into the afflicted Target. Every stack of Panicked gives a -1 EP and -1 AP at the start of their turn. Alongside the inability to use Skills or Attacks outside of movement. These stacks diminish by one at the end of their turn.","u":"elements-effects-conditions.html#term-panicked","p":"Elements, Effects, Conditions"},"hallucinating":{"t":"Hallucinating","d":"Reality is not as it seems to be. A Target suffering from Hallucinating is unable to determine friend, foe, and the dangers around them. They take Essence and Core rolls at Disadvantage, and must choose to either [Defend] or [Strike] at the start of their turn. If they choose to attack, it must be the closest possible…","u":"elements-effects-conditions.html#term-hallucinating","p":"Elements, Effects, Conditions"},"nightmare":{"t":"Nightmare","d":"The world is terrifying, enough to make you lose your mind.Target receives one Stack of [Hallucinating] and [Panicked] per-stack of [Nightmare] at the start of their turn, They have a -2 AP Debuff per-stack of Nightmare. Movement speed is halved. All stacks of Nightmare vanish at the end of their turn, but its…","u":"elements-effects-conditions.html#term-nightmare","p":"Elements, Effects, Conditions"},"dreaming":{"t":"Dreaming","d":"The world is a blissful place, enough to calm violence. Targets who have stacks of Dreaming receive +1 EP and +1d4 healing per-stack of [Dreaming] alongside one stack of [Charmed] per stack of [Dreaming] at the start of their turn. They become unable to use attacks or damage based skills until all stacks of [Dreaming]…","u":"elements-effects-conditions.html#term-dreaming","p":"Elements, Effects, Conditions"},"unconscious":{"t":"Unconscious","d":"Paralyze: Bleeding: Drowning: Broken: Deafened: Blinded: Restrained: Grappled: Nauseated: Poisoned: Sick: Blasted: Blungeoned: Piercing: Slashing:","u":"elements-effects-conditions.html#term-unconscious","p":"Elements, Effects, Conditions"},"hexed":{"t":"Hexed","d":"Allured: Invisible: Infused: Sorrowful: Joyous: Enraged: Calmed: Harmony: Target receives either +3 Temp AP or 1d10 HP per-round. Stacks diminish based on Skill. Dissonance: Target takes either -3 EP or 1d8+2 damage per round. Stacks diminish based on Skill.","u":"elements-effects-conditions.html#term-hexed","p":"Elements, Effects, Conditions"},"infested":{"t":"Infested","d":"Dying: EP Drain: AP Drain: MP Drain: HP Drain: Shell Drain: Core Drain: Essence Drain: EP Boost: AP Boost: MP Boost: HP Boost: Shell Boost: Core Boost: Essence Boost: Purified: Nullified:","u":"elements-effects-conditions.html#term-infested","p":"Elements, Effects, Conditions"},"spirit condition":{"t":"Spirit Condition","d":"s: Incorporeal: Between: Blighted: Hallowed:","u":"elements-effects-conditions.html#term-spirit-condition","p":"Elements, Effects, Conditions"},"connective mind":{"t":"Connective Mind","d":"Accessing the mind of a sentient being who is not [Will Locked] the user of this Arcana may use telepathy to speak into their mind. The voice spoken with is chosen by the caster, but the words are always translated into the language the receiver is most proficient with regardless of the caster’s own capability of…","u":"skills-skills-and-more-skills.html#skill-connective-mind","p":"Skills, Skills, and MORE SKILLS."},"connective net":{"t":"Connective Net","d":"This skill may be additionally activated by a caster using the [Connective Mind] ability. Allowing them to choose four active targets maximum besides themself when using this skill. These targets and the caster become a part of a telepathic web within a thirty foot radius allowing them to freely converse between…","u":"skills-skills-and-more-skills.html#skill-connective-net","p":"Skills, Skills, and MORE SKILLS."},"progression":{"t":"Progression","d":"Telepathy -> Control","u":"skills-skills-and-more-skills.html#skill-progression","p":"Skills, Skills, and MORE SKILLS."},"assured strike!":{"t":"Assured Strike!","d":"You don’t take it lightly when someone damages you, upon successfully being hit with a skill that does damage. You may use your reaction to gain a +2 to your next physical or ranged attack against them. This is only effective for the following round. If not used, cooldown still remains until usable again.","u":"skills-skills-and-more-skills.html#skill-assured-strike","p":"Skills, Skills, and MORE SKILLS."},"parry!":{"t":"Parry!","d":"Letting your guard down can cost you your life, you get ready to defend any incoming physical or ranged attacks. Granting you a +2 to your AP until the end of this skill’s effectiveness.","u":"skills-skills-and-more-skills.html#skill-parry","p":"Skills, Skills, and MORE SKILLS."},"unyielding force!":{"t":"Unyielding Force!","d":"It takes a lot more than normal to knock you down. Life force and strength easily flows through your veins even if temporary. When used this ability grants an immediate 10 Temp Health. That lasts until the end of the spell’s duration.","u":"skills-skills-and-more-skills.html#skill-unyielding-force","p":"Skills, Skills, and MORE SKILLS."},"reckless attack!":{"t":"Reckless Attack!","d":"Using all of your might you charge forth with a reckless physical or ranged attack. You concentrate it into your weapon to gain a 2 bonus damage dice of the weapon’s type.Target foe needs to do a Shell vs Shell roll against you to avoid taking full damage, taking half on a success, and none on a crit success.","u":"skills-skills-and-more-skills.html#skill-reckless-attack","p":"Skills, Skills, and MORE SKILLS."},"balancing act":{"t":"Balancing Act","d":"The flow of energy surrounding the user is capable of quickly applying stabilization to a target. Granting +3 AP until the end of their next turn.","u":"skills-skills-and-more-skills.html#skill-balancing-act","p":"Skills, Skills, and MORE SKILLS."},"objection!":{"t":"Objection!","d":"Lies do not easily pass you, as a reaction when a target attempts to deceive you; both you and the target do an essence roll against each other. Upon a success, you become aware of the fact they are lying, even if you continue to lack the knowledge about the specifics.","u":"skills-skills-and-more-skills.html#skill-objection","p":"Skills, Skills, and MORE SKILLS."},"mediate":{"t":"Mediate","d":"Chaos is dismissed at your whim, applying a target with your persuasion of Order. You relieve them of harmful effects. For the next three rounds one negative effect chosen by them; such as [Bleeding] or [Burning] has its length reduced by 1 round.","u":"skills-skills-and-more-skills.html#skill-mediate","p":"Skills, Skills, and MORE SKILLS."},"the judge":{"t":"The Judge","d":"You decide the final verdict, when you or an ally within range are successfully hit by an Essence based attack, you can use your reaction to counter it with a successful essence roll vs the target.","u":"skills-skills-and-more-skills.html#skill-the-judge","p":"Skills, Skills, and MORE SKILLS."},"variable violence":{"t":"Variable Violence","d":"Overwhelming power comes with many unknowns, despite this you take your chances. Wielding this metaphysical chaos against your enemies. After rolling a successful Essence roll against your opponent’s AP roll a 1d6 to decide the effect of the attack. [1-2 \\= 1d6 Damage] [3-4 \\= -2 EP] [5-6=1d8 Damage]","u":"skills-skills-and-more-skills.html#skill-variable-violence","p":"Skills, Skills, and MORE SKILLS."},"tampering tricks":{"t":"Tampering Tricks","d":"Inflicting your chaos upon a chosen target, you attempt to change their luck until the end of this spell’s effectiveness. Roll a 1d10 for the effect. This effect is automatic upon being casted. [1-2 -2 AP] [3-4 -4 AP] [5-6 -2 EP] [7-8 -4 EP] [9-10 1d10 Dmg]","u":"skills-skills-and-more-skills.html#skill-tampering-tricks","p":"Skills, Skills, and MORE SKILLS."},"always a chance":{"t":"Always a Chance","d":"Things don’t always go to plan when chaos ensues, upon being hit or seeing an ally hit successfully with an attack within range immediately use your reaction to impose a -4 to the attacker’s total attack roll to attempt to cancel it entirely if the new roll is lower than the protected person’s total AP score.","u":"skills-skills-and-more-skills.html#skill-always-a-chance","p":"Skills, Skills, and MORE SKILLS."},"expand the nonsense":{"t":"Expand the Nonsense","d":"Order? Respecting reality? These rules do not apply when you’re around. Upon activation afflicts every foe within a 30 foot radius centered on the self with one of these random effects individually decided by a 1d6 roll each. [1-2 -10 MP] [3-4 2d8 DMG] [5-6 Knocked Prone] [7-8 Knocked backwards 10 Feet] [9-10 Dazed]…","u":"skills-skills-and-more-skills.html#skill-expand-the-nonsense","p":"Skills, Skills, and MORE SKILLS."},"the executioner":{"t":"The Executioner","d":"It is easy to take advantage of suffering and misfortune you sow with extreme ease. When any enemy within range falls below half of their total non-temp HP. You can strike out to kick them while they’re down. Upon a successful Essence strike against the target, you deal 2d12 damage directly to their health. (Bypassing…","u":"skills-skills-and-more-skills.html#skill-the-executioner","p":"Skills, Skills, and MORE SKILLS."},"between the worlds":{"t":"Between the Worlds","d":"With balance, all things become clear. With an understanding comes true sight. Upon activation gain the ability to see [Invisible] [Incorporeal] or creatures within a 100 foot radius centered on the caster. You peak past the physical veil to see the realms of energy and soul, while anchoring yourself in your realm.","u":"skills-skills-and-more-skills.html#skill-between-the-worlds","p":"Skills, Skills, and MORE SKILLS."},"neutrality in all things":{"t":"Neutrality in all Things","d":"Chaos and Order are far too simple of concepts; to bend reality under truly neutrality is far superior. Enforcing true neutrality by binding an environment centered on a point within sight of the caster. Three chosen targets make a D15 Essence roll or become [Restrained] and [Dazed] until the end of this spell’s…","u":"skills-skills-and-more-skills.html#skill-neutrality-in-all-things","p":"Skills, Skills, and MORE SKILLS."},"universal tongues":{"t":"Universal Tongues","d":"The bridge between relations is often hindered by a lack of understanding. To elevate this struggle you have attuned your Median energy to act as a universal translator. Allowing you to speak to sentient entities that you can perceive and that choose to perceive you back. Their spoken words sound like any language…","u":"skills-skills-and-more-skills.html#skill-universal-tongues","p":"Skills, Skills, and MORE SKILLS."},"tangible balance":{"t":"Tangible Balance","d":"Light and Dark are only as prevalent as the one who perceives their change. You decide the Balance in any conflict. Aiming at two targets you choose to [Balance] or [Tip the Scale]. You may target yourself as one of the people on the scale. [Balance:] Equalize the primary health of both targets, any extra health is…","u":"skills-skills-and-more-skills.html#skill-tangible-balance","p":"Skills, Skills, and MORE SKILLS."},"the jury":{"t":"The Jury","d":"You decide the final outcome when a person’s life is on trial. Choose one target within range. Deem them as [Guilty] or [Not Guilty] to determine the effects. This lasts for as long as the spell’s effectiveness remains. You may target yourself as well. [Guilty:] -2 AP +2 Damage per Damage Dice against target. [Not…","u":"skills-skills-and-more-skills.html#skill-the-jury","p":"Skills, Skills, and MORE SKILLS."},"help is on the way!":{"t":"Help is on the way!","d":"Pure essence flows through you with ease, being shaped by your will it is capable of mending injuries. By touching a chosen target you may choose to either heal 1d6 HP, or 1d4 EP directly into their system. [You may target yourself[","u":"skills-skills-and-more-skills.html#skill-help-is-on-the-way","p":"Skills, Skills, and MORE SKILLS."},"stabilize health":{"t":"Stabilize Health","d":"The dying do not meet death unless you say so, when an ally within range is inflicted with the [Dying] condition you can use your reaction to roll a D10 essence roll to stabilize them to be [Unconscious] instead sparing their lives.","u":"skills-skills-and-more-skills.html#skill-stabilize-health","p":"Skills, Skills, and MORE SKILLS."},"booster shot!":{"t":"Booster Shot!","d":"There is seemingly nothing restorative energy can’t mend or in this case prevent. Assuring that your chosen target within range can survive the fight you give them 1d10 Temp Health that disperses after the spell is finished.","u":"skills-skills-and-more-skills.html#skill-booster-shot","p":"Skills, Skills, and MORE SKILLS."},"field medic":{"t":"Field Medic","d":"Always prepared when times get rough, you rely on an extra store of Pure Energy in which you draw from when needed. When activated you draw upon a total pool of 20 HP points in which you can divide as you choose among any targets within range including yourself.","u":"skills-skills-and-more-skills.html#skill-field-medic","p":"Skills, Skills, and MORE SKILLS."},"emergency!":{"t":"Emergency!","d":"When all seems lost, you know that just isn’t the case. Alert as ever you call upon a massive well of Pure energy to attempt saving a recently killed person’s life. If they have died within the last 10 rounds you may attempt a D15 Essence check to revivify them and stop death in its tracks entirely. This still leaves…","u":"skills-skills-and-more-skills.html#skill-emergency","p":"Skills, Skills, and MORE SKILLS."},"defibrillator dynamo":{"t":"Defibrillator Dynamo","d":"Rapidly begin charging up restorative energy while preparing to dose it into a single ally within range you can touch. Dashing forward to them within a limit of 30 feet. Every 5 feet covered before touching them adds an additional 1d4 at a base of 1d10.","u":"skills-skills-and-more-skills.html#skill-defibrillator-dynamo","p":"Skills, Skills, and MORE SKILLS."},"dance with death":{"t":"Dance with Death","d":"Life and Death have always been in a perpetual rhythm; neither can exist without eventually acknowledging the other. In tune with a counter part you temporarily swap massive amount of [Pure] and [Null] energy allowing you the ability to cast 1 skill from the [Null | Block] branch free of charge/slots as an [Instant]…","u":"skills-skills-and-more-skills.html#skill-dance-with-death","p":"Skills, Skills, and MORE SKILLS."},"harness harmony":{"t":"Harness Harmony","d":"[Harmony]is a tool that can mend to keep its balance. Choose two targets to give a stack of [Harmony] or which lasts until the end of this spell’s effectiveness. You can target yourself as one of these people. You may put one stack per-target chosen. Stacks dissipate by one at the end of the target's turn. [Harmony]…","u":"skills-skills-and-more-skills.html#skill-harness-harmony","p":"Skills, Skills, and MORE SKILLS."},"tap into the true flow":{"t":"Tap into the True Flow","d":"A surge of extremely overclocked [Pure] energy immediately connects to 4 targets within a sixty foot radius centered on the caster. For the duration of the spell’s effectiveness these chosen targets receive 2d8 per round.","u":"skills-skills-and-more-skills.html#skill-tap-into-the-true-flow","p":"Skills, Skills, and MORE SKILLS."},"dance with life":{"t":"Dance with Life","d":"Death and Life have always been in a perpetual rhythm; neither can exist without eventually acknowledging the other. In tune with a counter part you temporarily swap massive amount of [Null] and [Pure] energy allowing you the ability to cast 1 skill from the [Pure | Flow] branch free of charge/slots as an [Instant]…","u":"skills-skills-and-more-skills.html#skill-dance-with-life","p":"Skills, Skills, and MORE SKILLS."},"super lob":{"t":"Super Lob","d":"Summoning forth a large amount of your [Primary Element] you hurl it to a location within range. Everything within a 15 foot range of the center must do a successful d15 Shell roll to avoid taking damage. Failures result in them taking 1d10 damage and +1 [Elemental Effect]. Crits add an addition +1 [Elemental Effect]","u":"skills-skills-and-more-skills.html#skill-super-lob","p":"Skills, Skills, and MORE SKILLS."},"focused assault":{"t":"Focused Assault","d":"When a specific foe has caught your ire, you know just how to handle them. You form a precise amount of your [Primary Element] before directly at one chosen target within range. Upon a successful Essence roll against their AP you deal 2d8 Damage and apply +2 [Elemental Effect]","u":"skills-skills-and-more-skills.html#skill-focused-assault","p":"Skills, Skills, and MORE SKILLS."},"primary absorption":{"t":"Primary Absorption","d":"When a foe attempts to attack you with an element matching an element unlocked within your roster; you may choose to simply absorb a portion of the element itself, cutting the damage in half and lowering an [Elemental Effects] by one round.","u":"skills-skills-and-more-skills.html#skill-primary-absorption","p":"Skills, Skills, and MORE SKILLS."},"roaring release":{"t":"Roaring Release","d":"Considering your options carefully you bring forth Three charges of your [Primary Element]. These charges can be divided as you choose among 1-3 targets. Upon a successful Essence roll against the chosen target’s AP do 1d6 Damage and apply +1 [Elemental Effects]. Criticals do double damage and add an additional +1…","u":"skills-skills-and-more-skills.html#skill-roaring-release","p":"Skills, Skills, and MORE SKILLS."},"introduction":{"t":"Introduction","d":"“For as long as the modern people of Lychgate have inhabited this realm they have known the chords in the chorus of their world to have never quite been strummed correctly. A tune played by all, yet known by so very few. The gift of the core, the power of essence, and the tool that is their shell. They reap from the…","u":"introduction.html#introduction","p":"Introduction"},"the history of lychgate":{"t":"The History of Lychgate","d":"(From the perspective of an official council appointed historian | 56-BB5-01) [File Redacted: Conflicting Viewpoints on Official History. Appointment Revoked.] Within the safe haven continent known as Lychgate, hidden within the looming hold of the Linceul; a seemingly endless storm as dense as stone and as deadly as…","u":"introduction.html#the-history-of-lychgate","p":"Introduction"},"regions of aeode":{"t":"Regions of Aeode","d":"[Main Continent, Lower Left] Lychgate: A lychgate is a roofed gateway to a churchyard where a coffin (bier) would be temporarily placed for the start of the funeral service. [The Wild Continent, Upper Right] Beathan: Beathan is a Scottish Gaelic name meaning \"life\". It is a male name with historical roots in Scotland…","u":"introduction.html#regions-of-aeode","p":"Introduction"},"hallowed sun’s lament":{"t":"Hallowed Sun’s Lament","d":"Audio Reading We were young. All of us. Eons ago. We were new. There was nothing... and then there was me. Slowly. I didn't appear instantly, my form took unbelievably long to take shape. And with it... I was alone. Alone with myself. Alone amongst the stars. They were unreachable to me... I could not reach out to my…","u":"hallowed-suns-lament.html#hallowed-suns-lament","p":"Hallowed Sun's Lament"},"the prefect":{"t":"The Prefect","d":"Not all of the Askerhan are born aware of their purpose, even if many like their ancestors were designed with specific intents in mind. The Prefect however, is no such case. She has always known why she came into existence and in a matter of moments, immense power. A core aspect of the society she would build was…","u":"stories-tales-etc.html#the-prefect","p":"Stories | Tales | Etc"},"the whispers of beathan":{"t":"The Whispers of Beathan","d":"The Mourning Stone: A reportedly mystical rock found within a flowering spiral glade nestled within the brutal swamps of Beathan’s Lily-Grove. This formation of what appears to be a woman laying within the moss covered clearing, an assortment of overgrown wild flowers accompany all around her. The soil seems very…","u":"stories-tales-etc.html#the-whispers-of-beathan","p":"Stories | Tales | Etc"},"the many faces of tantalos":{"t":"The Many Faces of Tantalos","d":"“What a strange Vibrae-Kin; do you believe only soulful things can think?” [A Vibrae-Kin is the demonstrably used term to explain the various forms of humanoid, sentient species, who host a three tiered system. This includes a shell, essence, and a sufficient enough core for consciousness and communication. Ex: A…","u":"the-cords-of-tantalos.html#the-many-faces-of-tantalos","p":"The Cords of Tantalos"},"the zera’yara":{"t":"The Zera’Yara","d":"The Seeds of Tantolos, the ancients, so many names are passed over the rarely spotted Zera’Yara. Many Fraeylings pay homage to Yara’s of old who they believe to be akin to spirit guides or their ancestors. Most have never even heard their common name; let alone could tell you where they come from. One thing that is…","u":"the-cords-of-tantalos.html#the-zerayara","p":"The Cords of Tantalos"},"the fraeylings":{"t":"The Fraeylings","d":"Also known as the Fraey, these hybrid-born creatures of the land often take the form of naturalistic animals mixed with varying levels of humanoid features. On a rare occasion some Fraeyling have been known to be descendants or even half Askerahn or Zera'Yeran. Allowing for the diversity of plant and insectoid…","u":"the-cords-of-tantalos.html#the-fraeylings","p":"The Cords of Tantalos"},"the peraxian":{"t":"The Peraxian","d":"The species known as the Peraxian no longer remember their point of origin. Believing in modern day that they hail from every star, across all of the vastness of space. Having been created from the aftermath of those same suns. They remain strongly aligned with two contradicting principles their people say to have…","u":"the-cords-of-tantalos.html#the-peraxian","p":"The Cords of Tantalos"},"the si’kure":{"t":"The Si’kure","d":"Like most of the races having sort of a spectrum for appearance. The Si'kure tend to range in the more reptilian/draconic area. Unlike their floral cousins, they tend to look like genuine reptiles and sometimes dragons depending on how strong their heritage is. The more humanoid a Si'kure looks the more likely they…","u":"the-cords-of-tantalos.html#the-sikure","p":"The Cords of Tantalos"},"the askerahn":{"t":"The Askerahn","d":"Once the shapers of entire empires, the Askerahn have been within Tantalos nearly just as long as the Zera’Yara. Though their origins are far more shrouded in mystery; it is known that the Askerahn descend from a Super-Hive speculated to be not even from the realm of Tanatlos at all. That instead this distinctly…","u":"the-cords-of-tantalos.html#the-askerahn","p":"The Cords of Tantalos"},"the daemon":{"t":"The Daemon","d":"Daemon, like many beings of Tantalos, come in a rather wide variety of appearances, shapes, and overall themes due to their method of creation. However unlike most creatures, Daemon often have the origin of being another person or entity’s creation. Being considered more a broad category than a strict guideline, the…","u":"the-cords-of-tantalos.html#the-daemon","p":"The Cords of Tantalos"},"the mud-sung":{"t":"The Mud-Sung","d":"Mud-Sung: Humans. I mean they're humans, their biggest benefit in this world is ironically the fact their name alludes to their biggest power. Humans have the most malleable and influenceable souls like clay or mud. They don't live for long, which requires their beings to be able to adapt as quickly as possible. If…","u":"the-cords-of-tantalos.html#the-mud-sung","p":"The Cords of Tantalos"},"the amalgam":{"t":"The Amalgam","d":"Due to not having a physical shell because of their origins, they require either enough energy to build a life-like copy, or a suitable body to inhabit to build off of. Typically this ends up with them /stealing/ bodies, to become physical beings. Without a body or host shell to hold them, they appear made of as a mix…","u":"the-cords-of-tantalos.html#the-amalgam","p":"The Cords of Tantalos"},"the beast of hallowed stars":{"t":"The Beast of Hallowed Stars","d":"[Sun Name] “Forgotten Light” [True Name: Lux’Malka] Lux meaning: Lux refers to the metric unit of illuminance, representing how much light falls onto a surface (one lumen per square meter). Derived from the Latin word for \"light\", the term is also frequently used as a first name or as shorthand for luxury. Malka…","u":"the-eon-kin.html#the-beast-of-hallowed-stars","p":"The Eon-Kin"},"the beast below the tides":{"t":"The Beast Below The Tides","d":"Tantolos “Planet of Hymns” [True Name: Zera’Morana] Zera meaning: The name Zera has multiple origins and meanings, but most commonly it is a Hebrew word meaning \"seed\" or \"offspring,\" symbolizing growth, new beginnings, and heritage. It can also refer to \"dawn,\" \"rising light,\" or \"rising\" in African cultures. Morana…","u":"the-eon-kin.html#the-beast-below-the-tides","p":"The Eon-Kin"},"terms and translations":{"t":"Terms and Translations","d":"A.E.K. | Artificial Eon-Kin: A Zera’Yaran that has been precisely and excruciatingly mutated and enhanced to allow a capacity and control over the three aspects often unrivaled even the oldest of their original branches. These entities however grow knowing that all that strength is not made for a mortal body, that if…","u":"the-eon-kin.html#terms-and-translations","p":"The Eon-Kin"},"core | animus":{"t":"Core | Animus","d":"At the very center of all thinking creatures is their Core. The spark of sentience that sets the living and the mindless apart. Like every soul, each creature's Core and its Animus signature are entirely unique to the circumstances of its genesis and there in how it is developed. The most common and simplistic example…","u":"the-three-aspects-astra-fibero-eternum.html#core-animus","p":"The Three Aspects [Astra, Fibero, Eternum]"},"shell | affix":{"t":"Shell | Affix","d":"All things present in a physical sense know this aspect keenly. Their form, a body, a concept, yet none the less what allows a being to exist and interact with the material-aspects of the realm. A Shell in relation to the three aspects is nearly as varied as its main binding element Essence is. This aspect extends to…","u":"the-three-aspects-astra-fibero-eternum.html#shell-affix","p":"The Three Aspects [Astra, Fibero, Eternum]"},"essence | afflatus":{"t":"Essence | Afflatus","d":"Essence Types and Distinctions: Memory: Material: Mayhem: Median: Majestic: Primary Forms of Essence and it’s Reactive Counterparts. Astra: The weave of energy that acts as the barrier between the various multiversal branches connected to the realm of Tantalos a proverbial interior to the metaphysical binding agent…","u":"the-three-aspects-astra-fibero-eternum.html#essence-afflatus","p":"The Three Aspects [Astra, Fibero, Eternum]"},"standard leveling":{"t":"Standard Leveling","d":"Leveling is ruled simply via Milestones, when the DM feels their players have successfully passed the threshold they set they may choose to award a level up as they please. Traditionally all players of a group would level up at the same time, however this is up to DM discretion. 0. +5 Skill Slot +3 Stat Point…","u":"levelling-stat-system.html#standard-leveling","p":"Levelling | Stat System"},"refinement system":{"t":"Refinement System","d":"(How to gain more points beyond typical level ups) Do training towards a specified aspect during a long rest. Each training allows the player to roll a 1d100. Gaining the amount of points based on the dice roll. Rolling a 1 \\= No points earned -1 to overstrained aspect until the next longrest. Rolling a 100 \\=…","u":"levelling-stat-system.html#refinement-system","p":"Levelling | Stat System"},"the signature system":{"t":"The Signature System","d":"Affix: The paint on the canvas, what makes their body who they are and their style. Afflatus: The unique light of one’s soul, a reflection of their inner being. The thematic representation of their abilities. Animus: The signature spark that represents a being’s personalized abilities and/or magic. Ability: The…","u":"signatures-affix-animus-afflauntus-ability.html#the-signature-system","p":"Signatures [Affix, Animus, Afflauntus, Ability]"},"e.w.a.e":{"t":"E.W.A.E","d":"[Balance] [Essence] [Wonder] [Afflauntus] [Eternum]: NULL: Void -> Block -> Despair ↗ LINK: Soul -> Siphon -> Supplement BALANCE: Order -> Chaos -> Median ↕ ↘ EXISTENCE: Sway -> Soothe -> Summon PURE: Vital -> Flow -> Rejoice OPTIMIZED: Practiced -> Poised -> Perfected ↗ TRADITIONAL: Aspire -> Associate-> Anicent…","u":"arcana-wonder-will-weapon.html#e-w-a-e","p":"Arcana [Wonder, Will, Weapon]"},"the skill trees":{"t":"The Skill Trees","d":"PERCEPTION: Precog -> Sight -> Dream ^ CONCEPT: Manifest -> Doubt -> Remember ll ↗ MIND: Telepathy -> Telekinesis -> Thought ↘ ↘ ↘ BIND: Rift -> Stasis -> Aura CONTROL: Puppet -> Combine -> Tinker AFFIXED: Distort -> Construct -> Weave ↗ UNBIND: Projection -> Precision -> Mock ↗ TRAIT: Enhance -> Defend -> Disgrace ||…","u":"skills-skills-and-more-skills.html#the-skill-trees","p":"Skills, Skills, and MORE SKILLS."},"destruction":{"t":"Destruction","d":"[T1 ]Components: Progression [T1] Components -> [T2] Conform [T2] Conform: Progression [T2] Conform -> [T3] Convert","u":"skills-skills-and-more-skills.html#destruction","p":"Skills, Skills, and MORE SKILLS."},"new age":{"t":"New Age","d":"[T1 ]Ponder: Progression [T1] Ponder -> [T2] Thesis [T2] Thesis: Progression [T2] Thesis -> [T3] Invent","u":"skills-skills-and-more-skills.html#new-age","p":"Skills, Skills, and MORE SKILLS."},"elemental conditions":{"t":"Elemental Conditions","d":"Primary Four: Burning: Target takes 1d4+1 damage at the start of their turn per-stack of Burning. The stack then reduces by one. Freezing: Target receives a -5 MP debuff per-stack of Freezing. The stack reduces by one at the end of the target’s turn. Crushed: Target receives a -1 AP penalty per-stack of Crushed. The…","u":"elements-effects-conditions.html#elemental-conditions","p":"Elements, Effects, Conditions"},"mental conditions":{"t":"Mental Conditions","d":"Confused: Target fumbles to use their next actions, attempting to attack results in a DC 20 Core Check, otherwise they will hit themselves with the damage instead. They may still choose to move or use defense on their turn, but all other actions are prohibited. Stacks of Confusion diminish by one at the end of their…","u":"elements-effects-conditions.html#mental-conditions","p":"Elements, Effects, Conditions"},"physical conditions":{"t":"Physical Conditions","d":"Unconscious: Paralyze: Bleeding: Drowning: Broken: Deafened: Blinded: Restrained: Grappled: Nauseated: Poisoned: Sick: Blasted: Blungeoned: Piercing: Slashing:","u":"elements-effects-conditions.html#physical-conditions","p":"Elements, Effects, Conditions"},"magical conditions":{"t":"Magical Conditions","d":"Hexed: Allured: Invisible: Infused: Sorrowful: Joyous: Enraged: Calmed: Harmony: Target receives either +3 Temp AP or 1d10 HP per-round. Stacks diminish based on Skill. Dissonance: Target takes either -3 EP or 1d8+2 damage per round. Stacks diminish based on Skill.","u":"elements-effects-conditions.html#magical-conditions","p":"Elements, Effects, Conditions"},"soul conditions":{"t":"Soul Conditions","d":"Infested: Dying: EP Drain: AP Drain: MP Drain: HP Drain: Shell Drain: Core Drain: Essence Drain: EP Boost: AP Boost: MP Boost: HP Boost: Shell Boost: Core Boost: Essence Boost: Purified: Nullified: Spirit Condition s: Incorporeal: Between: Blighted: Hallowed:","u":"elements-effects-conditions.html#soul-conditions","p":"Elements, Effects, Conditions"},"racial traits":{"t":"Racial Traits","d":"A.E.K | Unstable Valor: All Artificial Eon-Kin are a miracle of artificial creation, due to their unnatural form of coming into being all A.E.K. are unstable in some fashion.","u":"traits-afflictions-curses.html#racial-traits","p":"Traits, Afflictions, Curses"},"general traits":{"t":"General Traits","d":"Will Locked: An entity who has either purposefully or forcefully put a mental barrier around their minds. Blocking out most psionic abilities in the [Mind] tree that would attempt to connect or take information from an unwilling Will Locked target. If abilities of the [Mind] tree are used against them, they become…","u":"traits-afflictions-curses.html#general-traits","p":"Traits, Afflictions, Curses"},"symbiotic traits: -the dredge-":{"t":"Symbiotic Traits: -The Dredge-","d":"Parasitic Amphibian race created at the outer blast of the Collapse from people who fell into the oceans and were forcefully merged with Mara DNA. The Dredge can originate from every species but the Askerahn and thus is considered more like an undead infection than just a solitary species type. The Dredge created at…","u":"traits-afflictions-curses.html#symbiotic-traits-the-dredge","p":"Traits, Afflictions, Curses"},"afflictions":{"t":"Afflictions","d":"Crystallosis: The rapid formation of crystalized essence formed out of the body and energy of an organic creature often resulting in death.","u":"traits-afflictions-curses.html#afflictions","p":"Traits, Afflictions, Curses"}}</script>
