<style>
  /* The skill writer's bench, in the workshop's night-sky palette: where it goes on the left, what it does in the middle, how it measures up on the right. */
  :root {
    --ground: #121826; --panel: #1C2336; --ink: #262F48; --line: #3C4766; --text: #E6EEF3; --muted: #9AA6BF;
    --gold: #F2C14E; --teal: #5DC4B7; --error: #F08A7E; --paper: #F4EFE2; --paper-ink: #3A2A1A; --rule: #8E2B22;
    --display: "Cinzel", Georgia, serif; --caption: "EB Garamond", Georgia, serif; --ui: "Fira Sans", system-ui, sans-serif; --mono: "Fira Mono", ui-monospace, monospace;
    --chamfer: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    color-scheme: dark; scrollbar-color: var(--line) var(--ground);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  ::selection { background: var(--gold); color: var(--ground); }
  body { margin: 0; background: var(--ground); color: var(--text); font: 15px/1.5 var(--ui); padding: 20px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  a { color: var(--teal); text-underline-offset: 2px; }
  .top { max-width: 1500px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; }
  h1 { margin: 0; font: 600 clamp(26px, 4vw, 36px)/1.1 var(--display); }
  h2 { font: 600 20px/1.2 var(--display); margin: 0 0 8px; text-wrap: balance; }
  h3 { font: 700 11.5px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
  h3:first-child { margin-top: 0; }
  .lede { color: var(--muted); margin: 0; max-width: 38rem; }
  .tabs { max-width: 1500px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tabs button { font: 700 11.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--ink); border: 0; padding: 10px 14px; cursor: pointer; clip-path: var(--chamfer); transition: color .15s, background .15s; }
  .tabs button:hover { color: var(--text); }
  .tabs button[aria-selected="true"] { background: var(--gold); color: var(--ground); }
  .banner { max-width: 1500px; margin: 0 auto 14px; color: var(--muted); font-size: 14px; }
  .banner.err { color: var(--error); }
  #bench { max-width: 1500px; margin: 0 auto; }
  .forge { display: grid; grid-template-columns: minmax(0, 16rem) minmax(0, 1fr) minmax(0, 24rem); gap: 18px; align-items: start; }
  @media (max-width: 1180px) { .forge { grid-template-columns: minmax(0, 16rem) minmax(0, 1fr); } .forge .side { grid-column: 1 / -1; } }
  @media (max-width: 760px) { .forge { grid-template-columns: minmax(0, 1fr); } }
  .panel { background: var(--panel); border: 1px solid var(--line); padding: 16px; clip-path: var(--chamfer); }
  .stack { display: grid; gap: 14px; min-width: 0; }
  .note { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
  .note.ok { color: var(--teal); }
  .note.warn { color: var(--error); }

  .list { display: grid; gap: 6px; }
  .entry { text-align: left; background: var(--ink); color: var(--text); border: 1px solid var(--line); padding: 8px 12px; cursor: pointer; font: 15px/1.3 var(--ui); overflow-wrap: anywhere; transition: border-color .15s; }
  .entry:hover { border-color: var(--muted); }
  .entry small { display: block; color: var(--muted); font: 700 10.5px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .entry[aria-current="true"] { border-color: var(--gold); box-shadow: inset 3px 0 0 var(--gold); }

  .btn { font: 600 14px/1 var(--ui); color: var(--text); background: var(--ink); border: 1px solid var(--line); padding: 10px 14px; cursor: pointer; transition: border-color .15s, filter .15s; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--gold); color: var(--ground); border-color: var(--gold); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--error); }
  .btn.small { font-size: 13px; padding: 7px 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 10rem), 1fr)); gap: 10px 12px; }
  .fields .wide { grid-column: 1 / -1; }
  label, .legend { display: grid; gap: 4px; font: 700 11px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  label small { font: 13px/1.3 var(--ui); letter-spacing: 0; text-transform: none; }
  input, select, textarea { width: 100%; font: 15px/1.4 var(--ui); color: var(--text); background: var(--ink); border: 1px solid var(--line); padding: 8px 10px; font-variant-numeric: tabular-nums; }
  textarea { resize: vertical; min-height: 4.5rem; }
  input:hover, select:hover, textarea:hover { border-color: var(--muted); }
  label.check { display: flex; align-items: center; gap: 8px; align-self: end; padding-bottom: 9px; }
  label.check input { width: auto; accent-color: var(--gold); }

  .choices { display: grid; gap: 6px; margin-top: 4px; }
  .choices.three { grid-template-columns: repeat(3, 1fr); }
  .choice { font: 600 13px/1.25 var(--ui); text-align: left; color: var(--text); background: var(--ink); border: 1px solid var(--line); padding: 7px 10px; cursor: pointer; transition: border-color .15s; }
  .choice:hover { border-color: var(--muted); }
  .choice small { display: block; font: 12.5px/1.3 var(--ui); color: var(--muted); overflow-wrap: anywhere; }
  .choice[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
  .choice.written small { color: var(--teal); }

  .effect { border: 1px solid var(--line); padding: 10px; margin-bottom: 8px; }
  .effect-head { display: flex; justify-content: space-between; align-items: end; gap: 8px; margin-bottom: 8px; }
  .effect-head label { flex: 1; min-width: 0; }

  .block { background: var(--paper); color: var(--paper-ink); padding: 16px; border: 2px solid #B89A64; font: 16px/1.4 var(--caption); overflow-wrap: anywhere; }
  .block h4 { font: 600 22px/1.1 var(--display); color: var(--rule); margin: 0; }
  .block .sub { font: 600 13px/1.4 var(--ui); margin: 4px 0 8px; }
  .block .flavour { font-style: italic; margin: 0 0 6px; }
  .block .rules { font: 15px/1.45 var(--ui); margin: 0; }
  .block hr { border: 0; border-top: 2px solid var(--rule); margin: 10px 0; }
  .block dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; font: 14px/1.4 var(--ui); }
  .block dt { font-weight: 600; color: var(--rule); }
  .block dd { margin: 0; }

  .meter { margin: 8px 0; }
  .meter-line { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
  .meter-track { height: 6px; background: var(--ink); margin-top: 4px; position: relative; overflow: hidden; }
  .meter-fill { position: absolute; inset: 0 auto 0 0; background: var(--teal); transition: width .2s ease-out, background .15s; }
  .meter.over .meter-fill { background: var(--error); }
  .meter.over .meter-line b { color: var(--error); }
  .flags { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
  .flags .over { color: var(--error); }
  .flags .warn { color: var(--gold); }
  .clear { color: var(--teal); font-size: 14px; margin: 8px 0 0; }
  .facts { font-size: 14px; margin: 0; }
  .facts b { color: var(--gold); font-weight: 600; }
  .compare { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 14px; }
  .compare small { display: block; color: var(--muted); }
  #fallback { font: 13px/1.4 var(--mono); margin-top: 8px; }

  .tally { font-size: 16px; margin: 0 0 14px; }
  .tally b { color: var(--gold); font-weight: 600; }
  .key { display: inline-flex; align-items: center; gap: 6px; margin-right: 14px; font-size: 14px; color: var(--muted); }
  .maps { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 34rem), 1fr)); gap: 14px; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--ink); vertical-align: top; }
  thead th { font: 700 10.5px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  tbody th { font-weight: 600; white-space: nowrap; }
  .segname { display: block; color: var(--muted); font-size: 13px; margin-bottom: 4px; white-space: nowrap; }
  .pips { display: flex; gap: 4px; }
  .pip { width: 18px; height: 18px; padding: 0; border: 1px solid var(--line); background: transparent; cursor: pointer; display: block; transition: border-color .15s; }
  .pip:hover { border-color: var(--text); }
  .pip.written { background: var(--gold); border-color: var(--gold); }
  .pip.drafted { background: transparent; border: 2px solid var(--teal); }

  .refgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 36rem), 1fr)); gap: 14px; align-items: start; }
  .here td, .here th { background: var(--ink); color: var(--gold); }
  td.here { background: var(--ink); color: var(--gold); }
  .rules-list { margin: 0; padding-left: 1.3rem; display: grid; gap: 6px; max-width: 70ch; }
  dl.plain { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 14px; }
  dl.plain dt { font-weight: 600; }
  dl.plain dd { margin: 0; color: var(--muted); }

/* shared navigation across the World of Dissonance pages (same block in the wiki, maker and workshop) */
.sitebar {
  display: flex; align-items: center; gap: 2px; min-height: 38px; overflow-x: auto; scrollbar-width: none;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  background: #0d1f24; border-bottom: 1px solid #24464d; font: 600 13px/1 "Fira Sans", system-ui, sans-serif;
}
.sitebar::-webkit-scrollbar { display: none; }
.sitebar .sb-name { margin-right: auto; padding-right: 16px; font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #9cc0ba; white-space: nowrap; }
.sitebar a { padding: 12px 12px 10px; color: #dbe9e5; text-decoration: none; letter-spacing: .04em; white-space: nowrap; border-bottom: 2px solid transparent; }
.sitebar a:hover { color: #fff; border-bottom-color: #4f7d84; }
.sitebar a:focus-visible { outline: 2px solid #c9a227; outline-offset: -2px; }
.sitebar a[aria-current] { color: #ecd68e; border-bottom-color: #c9a227; }
  .sitebar { margin: -20px calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 22px calc(-1 * max(16px, env(safe-area-inset-left, 0px))); }  /* full width above the padded page */
@media (max-width: 560px) { .sitebar { justify-content: space-between; } .sitebar .sb-name { display: none; } .sitebar a { padding-inline: 8px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <h1>Skill Forge</h1>
  <p class="lede">Place a skill in its tree, build what it does, and check it against the budgets. Then copy it into the doc; the wiki picks it up on its next sync.</p>
</header>

<script id="forgeskills" type="application/json">[{"name":"Connective Mind","slot":1,"tree":"mind","path":"Main Path","tier":1,"ep":0,"effect":"Accessing the mind of a sentient being who is not [Will Locked] the user of this Arcana may use telepathy to speak into their mind. The voice spoken with is chosen by the caster, but the words are always translated into the language the receiver is most proficient with regardless of the caster’s own capability of speaking such. This effect remains until their next long rest and may be willingly activated at any time during its total effectiveness time. Targets chosen by the caster for this skill are unable to respond unless [Connective Net] is additionally active upon use of this skill.","cast":"Instant","lasts":"Until next Long Rest","range":"60 Foot Radius Self","cooldown":"N/A","url":"skills-skills-and-more-skills.html#skill-connective-mind"},{"name":"Connective Net","slot":2,"tree":"mind","path":"Main Path","tier":1,"ep":2,"effect":"This skill may be additionally activated by a caster using the [Connective Mind] ability. Allowing them to choose four active targets maximum besides themself when using this skill. These targets and the caster become a part of a telepathic web within a thirty foot radius allowing them to freely converse between singular, multiple, or all targets affected by [Connective Net] . The caster may recast this skill to choose new targets to replace others already in their net. All words are individually translated similar to [Connective Mind] into the languages the receiver is most proficient with allowing free speaking.","cast":"Reaction","lasts":"Until out of Range","range":"30 Foot Radius Centered on the Caster.","cooldown":"1 Round","url":"skills-skills-and-more-skills.html#skill-connective-net"},{"name":"Practical Hit!","slot":1,"tree":"trait","path":"Main Path","tier":1,"ep":0,"effect":"Focusing yourself you go in for a strike! Using a Shell Roll vs your target’s AP, you may use any form of physical or ranged weaponry you have equipped in place of the damage or effects.","cast":"Instant","lasts":"1 Round","range":"Depends","cooldown":"N/A","url":"skills-skills-and-more-skills.html#t1-enhance"},{"name":"Assured Strike!","slot":2,"tree":"trait","path":"Main Path","tier":1,"ep":3,"effect":"You don’t take it lightly when someone damages you, upon successfully being hit with a skill that does damage. You may use your reaction to gain a +2 to your next physical or ranged attack against them. This is only effective for the following round. If not used, cooldown still remains until usable again.","cast":"Reaction","lasts":"1 Round","range":"Self","cooldown":"2 Rounds","url":"skills-skills-and-more-skills.html#skill-assured-strike"},{"name":"Parry!","slot":3,"tree":"trait","path":"Main Path","tier":1,"ep":5,"effect":"Letting your guard down can cost you your life, you get ready to defend any incoming physical or ranged attacks. Granting you a +2 to your AP until the end of this skill’s effectiveness.","cast":"1 Round","lasts":"2 Rounds","range":"Self","cooldown":"2 Rounds","url":"skills-skills-and-more-skills.html#skill-parry"},{"name":"Unyielding Force!","slot":1,"tree":"trait","path":"Main Path","tier":1,"ep":3,"effect":"It takes a lot more than normal to knock you down. Life force and strength easily flows through your veins even if temporary. When used this ability grants an immediate 10 Temp Health. That lasts until the end of the spell’s duration.","cast":"1 round","lasts":"2 Rounds","range":"Self","cooldown":"2 Rounds","url":"skills-skills-and-more-skills.html#skill-unyielding-force"},{"name":"Reckless Attack!","slot":5,"tree":"trait","path":"Main Path","tier":1,"ep":8,"effect":"Using all of your might you charge forth with a reckless physical or ranged attack. You concentrate it into your weapon to gain a 2 bonus damage dice of the weapon’s type.Target foe needs to do a Shell vs Shell roll against you to avoid taking full damage, taking half on a success, and none on a crit success.","cast":"1 round","lasts":"1 round","range":"Depends","cooldown":"5 Rounds","url":"skills-skills-and-more-skills.html#skill-reckless-attack"},{"name":"Logic and Order","slot":1,"tree":"balance","path":"Main Path","tier":1,"ep":0,"effect":"Assert order on the field, mitigate chaos by turning it against itself doing 1d6 damage on a successful essence roll vs the target’s AP.","cast":"Instant","lasts":"1 Round","range":"30 Feet","cooldown":"N/A","url":"skills-skills-and-more-skills.html#t1-order"},{"name":"Balancing Act","slot":2,"tree":"balance","path":"Main Path","tier":1,"ep":3,"effect":"The flow of energy surrounding the user is capable of quickly applying stabilization to a target. Granting +3 AP until the end of their next turn.","cast":"Instant","lasts":"1 Round","range":"30 Feet","cooldown":"1 Round","url":"skills-skills-and-more-skills.html#skill-balancing-act"},{"name":"Objection!","slot":3,"tree":"balance","path":"Main Path","tier":1,"ep":5,"effect":"Lies do not easily pass you, as a reaction when a target attempts to deceive you; both you and the target do an essence roll against each other. Upon a success, you become aware of the fact they are lying, even if you continue to lack the knowledge about the specifics.","cast":"Reaction","lasts":"1 Round","range":"60 Feet","cooldown":"2 Rounds","url":"skills-skills-and-more-skills.html#skill-objection"},{"name":"Mediate","slot":4,"tree":"balance","path":"Main Path","tier":1,"ep":2,"effect":"Chaos is dismissed at your whim, applying a target with your persuasion of Order. You relieve them of harmful effects. For the next three rounds one negative effect chosen by them; such as [Bleeding] or [Burning] has its length reduced by 1 round.","cast":"1 Round","lasts":"3 Rounds","range":"Touch","cooldown":"2 Rounds","url":"skills-skills-and-more-skills.html#skill-mediate"},{"name":"The Judge","slot":5,"tree":"balance","path":"Main Path","tier":1,"ep":8,"effect":"You decide the final verdict, when you or an ally within range are successfully hit by an Essence based attack, you can use your reaction to counter it with a successful essence roll vs the target.","cast":"Reaction","lasts":"1 Round","range":"100 Feet","cooldown":"5 rounds","url":"skills-skills-and-more-skills.html#skill-the-judge"},{"name":"Variable Violence","slot":1,"tree":"balance","path":"Main Path","tier":2,"ep":0,"effect":"Overwhelming power comes with many unknowns, despite this you take your chances. Wielding this metaphysical chaos against your enemies. After rolling a successful Essence roll against your opponent’s AP roll a 1d6 to decide the effect of the attack. [1-2 \\= 1d6 Damage] [3-4 \\= -2 EP] [5-6=1d8 Damage]","cast":"Instant","lasts":"1 Round","range":"30 Feet","cooldown":"N/A","url":"skills-skills-and-more-skills.html#skill-variable-violence"},{"name":"Tampering Tricks","slot":2,"tree":"balance","path":"Main Path","tier":2,"ep":4,"effect":"Inflicting your chaos upon a chosen target, you attempt to change their luck until the end of this spell’s effectiveness. Roll a 1d10 for the effect. This effect is automatic upon being casted. [1-2 -2 AP] [3-4 -4 AP] [5-6 -2 EP] [7-8 -4 EP] [9-10 1d10 Dmg]","cast":"1 round","lasts":"2 Rounds","range":"100 Feet","cooldown":"3 Rounds","url":"skills-skills-and-more-skills.html#skill-tampering-tricks"},{"name":"Always a Chance","slot":3,"tree":"balance","path":"Main Path","tier":2,"ep":5,"effect":"Things don’t always go to plan when chaos ensues, upon being hit or seeing an ally hit successfully with an attack within range immediately use your reaction to impose a -4 to the attacker’s total attack roll to attempt to cancel it entirely if the new roll is lower than the protected person’s total AP score.","cast":"Reaction","lasts":"1 Round","range":"60 Feet","cooldown":"3 Rounds","url":"skills-skills-and-more-skills.html#skill-always-a-chance"},{"name":"Expand the Nonsense","slot":4,"tree":"balance","path":"Main Path","tier":2,"ep":5,"effect":"Order? Respecting reality? These rules do not apply when you’re around. Upon activation afflicts every foe within a 30 foot radius centered on the self with one of these random effects individually decided by a 1d6 roll each. [1-2 -10 MP] [3-4 2d8 DMG] [5-6 Knocked Prone] [7-8 Knocked backwards 10 Feet] [9-10 Dazed]. These effects last for as long as the spell is active.","cast":"1 Rounds","lasts":"3 Rounds","range":"Self 30 Feet","cooldown":"4 Rounds","url":"skills-skills-and-more-skills.html#skill-expand-the-nonsense"},{"name":"The Executioner","slot":5,"tree":"balance","path":"Main Path","tier":2,"ep":10,"effect":"It is easy to take advantage of suffering and misfortune you sow with extreme ease. When any enemy within range falls below half of their total non-temp HP. You can strike out to kick them while they’re down. Upon a successful Essence strike against the target, you deal 2d12 damage directly to their health. (Bypassing Temp HP)","cast":"Reaction","lasts":"1 Round","range":"30 Feet","cooldown":"6 Rounds","url":"skills-skills-and-more-skills.html#skill-the-executioner"},{"name":"Between the Worlds","slot":1,"tree":"balance","path":"Main Path","tier":3,"ep":0,"effect":"With balance, all things become clear. With an understanding comes true sight. Upon activation gain the ability to see [Invisible] [Incorporeal] or creatures within a 100 foot radius centered on the caster. You peak past the physical veil to see the realms of energy and soul, while anchoring yourself in your realm.","cast":"Instant","lasts":"5 Rounds","range":"Self 100 Feet","cooldown":"N/A","url":"skills-skills-and-more-skills.html#skill-between-the-worlds"},{"name":"Neutrality in all Things","slot":2,"tree":"balance","path":"Main Path","tier":3,"ep":6,"effect":"Chaos and Order are far too simple of concepts; to bend reality under truly neutrality is far superior. Enforcing true neutrality by binding an environment centered on a point within sight of the caster. Three chosen targets make a D15 Essence roll or become [Restrained] and [Dazed] until the end of this spell’s effectiveness.","cast":"2 Round","lasts":"3 Rounds","range":"30 Feet Radius","cooldown":"3 Rounds","url":"skills-skills-and-more-skills.html#skill-neutrality-in-all-things"},{"name":"Universal Tongues","slot":3,"tree":"balance","path":"Main Path","tier":3,"ep":4,"effect":"The bridge between relations is often hindered by a lack of understanding. To elevate this struggle you have attuned your Median energy to act as a universal translator. Allowing you to speak to sentient entities that you can perceive and that choose to perceive you back. Their spoken words sound like any language your character is most proficient in, and the same in verse for anything you speak to them. (This does not work for written text, as the audible spoken words are required. This does not give you the ability to innately know a language you don’t; it only translates whatever is heard into one that you do.)","cast":"1 Round","lasts":"5 Rounds","range":"Self","cooldown":"5 Rounds","url":"skills-skills-and-more-skills.html#skill-universal-tongues"},{"name":"Tangible Balance","slot":4,"tree":"balance","path":"Main Path","tier":3,"ep":8,"effect":"Light and Dark are only as prevalent as the one who perceives their change. You decide the Balance in any conflict. Aiming at two targets you choose to [Balance] or [Tip the Scale]. You may target yourself as one of the people on the scale. [Balance:] Equalize the primary health of both targets, any extra health is forfeit. [Tip the Scale:] Deduct one third of chosen target health, and give it to the other person being weighed on the scale.","cast":"3 Rounds","lasts":"1 Round.","range":"Self 100 Feet","cooldown":"8 Rounds","url":"skills-skills-and-more-skills.html#skill-tangible-balance"},{"name":"The Jury","slot":5,"tree":"balance","path":"Main Path","tier":3,"ep":8,"effect":"You decide the final outcome when a person’s life is on trial. Choose one target within range. Deem them as [Guilty] or [Not Guilty] to determine the effects. This lasts for as long as the spell’s effectiveness remains. You may target yourself as well. [Guilty:] -2 AP +2 Damage per Damage Dice against target. [Not Guilty:] +10 Temp Health, +2 AP, +4 EP","cast":"2 Rounds","lasts":"4 Rounds","range":"60 Feet","cooldown":"4 Rounds","url":"skills-skills-and-more-skills.html#skill-the-jury"},{"name":"Help is on the way!","slot":1,"tree":"balance","path":"Pure","tier":1,"ep":0,"effect":"Pure essence flows through you with ease, being shaped by your will it is capable of mending injuries. By touching a chosen target you may choose to either heal 1d6 HP, or 1d4 EP directly into their system. [You may target yourself[","cast":"Instant","lasts":"1 Round","range":"Touch","cooldown":"1 Rounds","url":"skills-skills-and-more-skills.html#skill-help-is-on-the-way"},{"name":"Stabilize Health","slot":2,"tree":"balance","path":"Pure","tier":1,"ep":5,"effect":"The dying do not meet death unless you say so, when an ally within range is inflicted with the [Dying] condition you can use your reaction to roll a D10 essence roll to stabilize them to be [Unconscious] instead sparing their lives.","cast":"Reaction.","lasts":"1 Round","range":"60 feet","cooldown":"3 rounds","url":"skills-skills-and-more-skills.html#skill-stabilize-health"},{"name":"Booster Shot!","slot":3,"tree":"balance","path":"Pure","tier":1,"ep":3,"effect":"There is seemingly nothing restorative energy can’t mend or in this case prevent. Assuring that your chosen target within range can survive the fight you give them 1d10 Temp Health that disperses after the spell is finished.","cast":"1 Round","lasts":"4 Rounds","range":"30 Feet","cooldown":"2 Round","url":"skills-skills-and-more-skills.html#skill-booster-shot"},{"name":"Field Medic","slot":4,"tree":"balance","path":"Pure","tier":1,"ep":6,"effect":"Always prepared when times get rough, you rely on an extra store of Pure Energy in which you draw from when needed. When activated you draw upon a total pool of 20 HP points in which you can divide as you choose among any targets within range including yourself.","cast":"1 Round","lasts":"1 round","range":"30 feet","cooldown":"3 rounds","url":"skills-skills-and-more-skills.html#skill-field-medic"},{"name":"Emergency!","slot":5,"tree":"balance","path":"Pure","tier":1,"ep":8,"effect":"When all seems lost, you know that just isn’t the case. Alert as ever you call upon a massive well of Pure energy to attempt saving a recently killed person’s life. If they have died within the last 10 rounds you may attempt a D15 Essence check to revivify them and stop death in its tracks entirely. This still leaves them [Unconscious] .","cast":"2 Round","lasts":"1 Round","range":"Touch","cooldown":"5 Rounds","url":"skills-skills-and-more-skills.html#skill-emergency"},{"name":"Freedom Flows","slot":1,"tree":"balance","path":"Pure","tier":2,"ep":0,"effect":"Just like emotions, the freedom of movement and life should be shared! Focusing on yourself, or a target you can touch. You grant them true freedom for a short time while also mending their wounds. The target receives a flat 15 HP back, alongside a +10 MP bonus that lasts until the end of their next turn. If the target is suffering from the [Grappled] or [Restrained] conditions they are immediately removed once the spell takes effect.","cast":"Instant","lasts":"1 Round","range":"Self Touch","cooldown":"1 Rounds","url":"skills-skills-and-more-skills.html#t2-flow"},{"name":"Defibrillator Dynamo","slot":2,"tree":"balance","path":"Pure","tier":2,"ep":6,"effect":"Rapidly begin charging up restorative energy while preparing to dose it into a single ally within range you can touch. Dashing forward to them within a limit of 30 feet. Every 5 feet covered before touching them adds an additional 1d4 at a base of 1d10.","cast":"1 Round","lasts":"1 Round","range":"Touch 30 Feet","cooldown":"3 Rounds","url":"skills-skills-and-more-skills.html#skill-defibrillator-dynamo"},{"name":"Dance with Death","slot":3,"tree":"balance","path":"Pure","tier":2,"ep":10,"effect":"Life and Death have always been in a perpetual rhythm; neither can exist without eventually acknowledging the other. In tune with a counter part you temporarily swap massive amount of [Pure] and [Null] energy allowing you the ability to cast 1 skill from the [Null | Block] branch free of charge/slots as an [Instant] . This requires either another consenting player with the opposite paired skill [Dance with Life] to activate together or a caster who has both [Dance with Death] and [Dance with Life] unlocked. Requiring both parties or the caster to pay the 10 EP price of their respective skills.","cast":"2 Rounds","lasts":"1 Round","range":"Self","cooldown":"6 Rounds","url":"skills-skills-and-more-skills.html#skill-dance-with-death"},{"name":"Harness Harmony","slot":4,"tree":"balance","path":"Pure","tier":2,"ep":6,"effect":"[Harmony] is a tool that can mend to keep its balance. Choose two targets to give a stack of [Harmony] or which lasts until the end of this spell’s effectiveness. You can target yourself as one of these people. You may put one stack per-target chosen. Stacks dissipate by one at the end of the target's turn. [Harmony] : Target receives either +3 Temp AP or 1d10 HP per-round.","cast":"1 round","lasts":"2 rounds","range":"Self 30 Foot Radius","cooldown":"2 rounds","url":"skills-skills-and-more-skills.html#skill-harness-harmony"},{"name":"Tap into the True Flow","slot":5,"tree":"balance","path":"Pure","tier":2,"ep":8,"effect":"A surge of extremely overclocked [Pure] energy immediately connects to 4 targets within a sixty foot radius centered on the caster. For the duration of the spell’s effectiveness these chosen targets receive 2d8 per round.","cast":"3 rounds","lasts":"5 Rounds","range":"Self 60 Foot Radius","cooldown":"5 rounds","url":"skills-skills-and-more-skills.html#skill-tap-into-the-true-flow"},{"name":"Positive Thinking!","slot":1,"tree":"balance","path":"Pure","tier":3,"ep":0,"effect":"This cruel world never seems to get you down, that joy is easy to share with your companions! Directly your positivity towards an ally you lessen a condition such as [Confused, Frightened, Panicked, or Sorrowful] by one round.","cast":"1 round.","lasts":"1 round","range":"30 feet","cooldown":"1 round.","url":"skills-skills-and-more-skills.html#t3-rejoice"},{"name":"Dance with Life","slot":3,"tree":"balance","path":"Null","tier":2,"ep":10,"effect":"Death and Life have always been in a perpetual rhythm; neither can exist without eventually acknowledging the other. In tune with a counter part you temporarily swap massive amount of [Null] and [Pure] energy allowing you the ability to cast 1 skill from the [Pure | Flow] branch free of charge/slots as an [Instant] . This requires either another consenting player with the opposite paired skill [Dance with Death] to activate together or a caster who has both [Dance with Life] and [Dance with Death] unlocked. Requiring both parties or the caster to pay the 10 EP price of their respective skills.","cast":"2 Rounds","lasts":"1 Round","range":"Self","cooldown":"6 Rounds","url":"skills-skills-and-more-skills.html#skill-dance-with-life"},{"name":"Elmental Missile","slot":1,"tree":"element","path":"Main Path","tier":1,"ep":0,"effect":"Collecting a mass of your [Primary Element], you hurl it forward towards a foe attempting an Essence roll against their AP. Upon a normal success do 1d6 damage. Crit successes add +1 [Elemental Effect] to the afflicted person being targeted.","cast":"Instant","lasts":"1 Round","range":"30 feet","cooldown":"N/A","url":"skills-skills-and-more-skills.html#t1-temper"},{"name":"Super Lob","slot":2,"tree":"element","path":"Main Path","tier":1,"ep":4,"effect":"Summoning forth a large amount of your [Primary Element] you hurl it to a location within range. Everything within a 15 foot range of the center must do a successful d15 Shell roll to avoid taking damage. Failures result in them taking 1d10 damage and +1 [Elemental Effect]. Crits add an addition +1 [Elemental Effect]","cast":"1 Round","lasts":"1 Round","range":"60 Feet","cooldown":"3 rounds","url":"skills-skills-and-more-skills.html#skill-super-lob"},{"name":"Focused Assault","slot":3,"tree":"element","path":"Main Path","tier":1,"ep":5,"effect":"When a specific foe has caught your ire, you know just how to handle them. You form a precise amount of your [Primary Element] before directly at one chosen target within range. Upon a successful Essence roll against their AP you deal 2d8 Damage and apply +2 [Elemental Effect]","cast":"1 Round","lasts":"1 Round","range":"60 Feet","cooldown":"2 Rounds","url":"skills-skills-and-more-skills.html#skill-focused-assault"},{"name":"Primary Absorption","slot":4,"tree":"element","path":"Main Path","tier":1,"ep":3,"effect":"When a foe attempts to attack you with an element matching an element unlocked within your roster; you may choose to simply absorb a portion of the element itself, cutting the damage in half and lowering an [Elemental Effects] by one round.","cast":"Reaction","lasts":"1 Round","range":"Self","cooldown":"2 Rounds","url":"skills-skills-and-more-skills.html#skill-primary-absorption"},{"name":"Roaring Release","slot":5,"tree":"element","path":"Main Path","tier":1,"ep":8,"effect":"Considering your options carefully you bring forth Three charges of your [Primary Element]. These charges can be divided as you choose among 1-3 targets. Upon a successful Essence roll against the chosen target’s AP do 1d6 Damage and apply +1 [Elemental Effects]. Criticals do double damage and add an additional +1 [Elemental Effect] against them as well.","cast":"1 Round","lasts":"1 Round","range":"30 Feet","cooldown":"4 Rounds","url":"skills-skills-and-more-skills.html#skill-roaring-release"}]</script>
