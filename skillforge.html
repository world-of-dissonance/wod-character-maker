const filled = x => ({ ...blank(x.tree || 'mind', x.track, x.tier, x.slot), ...x, edited: x.edited && typeof x.edited === 'object' ? x.edited : {} });
function loadDrafts() {
  try {
    const d = JSON.parse(localStorage.getItem(DRAFTS_KEY));
    if (d && d.v === 1 && Array.isArray(d.drafts)) state.drafts = d.drafts.filter(Forge.validDraft).map(filled);
  } catch (e) { state.storageOk = false; }
}
function saveDrafts() {
  try { localStorage.setItem(DRAFTS_KEY, JSON.stringify({ v: 1, drafts: state.drafts })); state.storageOk = true; }
  catch (e) { state.storageOk = false; }
}
const cur = () => state.drafts[state.current];
/** What the core judges: a reaction's trigger and a roll's crit only count when they apply, and an area skill's numbers are area numbers. */
function view(d) {
  const spread = /radius|line/i.test(d.area || '');
  return { ...d, trigger: d.cast === 'Reaction' ? d.trigger : '', crit: d.roll === 'none' ? '' : d.crit, effects: d.effects.map(e => ({ ...e, isArea: spread })) };
}
const trackKey = s => (s.path === 'Main Path' ? 'main' : s.path);
const sameTrack = (a, b) => String(a).toLowerCase() === String(b).toLowerCase();
const treeOf = id => state.trees.find(t => t.id === id);
const tiersOf = (tree, track) => (track === 'main' ? tree?.main : tree?.branches.find(b => sameTrack(b.name, track))?.tiers) || [];
const writtenAt = (tree, track, tier, slot) => state.skills.find(s => s.tree === tree && sameTrack(trackKey(s), track) && s.tier === tier && s.slot === slot);
function knownLists(d) {
  const skillNames = state.skills.map(s => s.name).concat(state.drafts.filter(x => x !== d).map(x => x.name).filter(Boolean));
  const tags = Object.keys(state.glossary);
  for (const s of state.skills) for (const [, t] of (s.effect || '').matchAll(/\[([^\]]+)\]/g)) tags.push(t.trim());
  return { skillNames, tags };
}

// ---------- tabs ----------
function render() {
  $('tabs').innerHTML = [['forge', 'Forge'], ['map', 'Tree map'], ['ref', 'Reference']].map(([k, label]) => `<button role="tab" type="button" data-tab="${k}" aria-selected="${state.tab === k}">${label}</button>`).join('');
  const focus = document.activeElement?.dataset?.fkey;
  $('bench').innerHTML = state.tab === 'forge' ? forgeView() : state.tab === 'map' ? mapView() : refView();
  if (state.tab === 'forge') paint();
  if (focus) document.querySelector(`[data-fkey="${CSS.escape(focus)}"]`)?.focus();
}

// ---------- the forge ----------
function options(list, value) {
  return list.map(o => `<option${o === value ? ' selected' : ''}>${esc(o)}</option>`).join('');
}
function forgeView() {
  const d = cur();
  const drafts = state.drafts.length ? state.drafts.map((x, i) => `<button type="button" class="entry" data-pick="${i}" aria-current="${i === state.current}"><small>${esc(x.tree)} · ${x.track === 'main' ? 'Main' : esc(x.track)} · T${x.tier} · #${x.slot}</small>${esc(x.name || 'Unnamed skill')}</button>`).join('')
    : '<p class="note" style="margin:0">Nothing here yet. Make a new draft, or pick an empty slot on the Tree map.</p>';
  const left = `<div class="stack"><section class="panel"><h3>Drafts</h3><div class="list" id="draftlist">${drafts}</div>
    <div class="row" style="margin-top:10px"><button type="button" class="btn small" data-act="new" data-fkey="act-new">New draft</button><button type="button" class="btn small" data-act="import">Import</button><button type="button" class="btn small" data-act="export"${state.drafts.length ? '' : ' disabled'}>Export</button></div>
    <p class="note" id="draftnote"${state.storageOk ? ' hidden' : ''}>This browser won't keep drafts. Export them before you leave.</p></section>${d ? placement(d) : ''}</div>`;
  if (!d) return `<div class="forge">${left}<section class="panel"><h2>Start a skill</h2><p class="note" style="margin:0 0 12px">A draft starts from its slot's template, so pick where it goes first.</p><button type="button" class="btn primary" data-act="new">New draft</button></section></div>`;
  return `<div class="forge">${left}<div class="stack">${form(d)}</div><div class="stack side">
    <section class="panel"><div class="block" id="preview"></div><div class="row" style="margin-top:12px"><button type="button" class="btn primary" data-act="copy">Copy for the doc</button>${deleteControl()}</div><p class="note" id="copynote" role="status" aria-live="polite"></p><div id="fallback"></div></section>
    <section class="panel" id="budget"></section><section class="panel" id="compare"></section></div></div>`;
}
const deleteControl = () => (state.confirmDelete
  ? '<span class="note" style="margin:0">Delete this draft?</span><button type="button" class="btn small danger" data-act="delete-yes" data-fkey="act-del-yes">Delete</button><button type="button" class="btn small" data-act="delete-no">Keep</button>'
  : '<button type="button" class="btn danger" data-act="delete" data-fkey="act-del">Delete</button>');

function placement(d) {
  const tree = treeOf(d.tree), slots = Forge.BUDGET.slots, tiers = tiersOf(tree, d.track);
  const trees = state.trees.map(t => `<option value="${esc(t.id)}"${t.id === d.tree ? ' selected' : ''}>${esc(t.name)}</option>`).join('') || `<option>${esc(d.tree)}</option>`;
  const tracks = [['main', 'Main Path']].concat((tree?.branches || []).map(b => [b.name, b.name])).map(([v, l]) => `<option value="${esc(v)}"${sameTrack(v, d.track) ? ' selected' : ''}>${esc(l)}</option>`).join('');
  return `<section class="panel"><h3>Where it goes</h3><div class="fields">
    <label class="wide">Tree<select data-place="tree" data-fkey="place-tree">${trees}</select></label>
    <label class="wide">Path<select data-place="track" data-fkey="place-track">${tracks}</select></label></div>
    <div class="legend" style="margin-top:10px">Tier<div class="choices three">${[1, 2, 3].map(t => `<button type="button" class="choice" data-tier="${t}" data-fkey="tier-${t}" aria-pressed="${d.tier === t}">T${t}<small>${esc(tiers[t - 1] || '')}</small></button>`).join('')}</div></div>
    <div class="legend" style="margin-top:10px">Slot<div class="choices">${slots.map((s, i) => {
    const w = writtenAt(d.tree, d.track, d.tier, i + 1);
    return `<button type="button" class="choice${w ? ' written' : ''}" data-slot="${i + 1}" data-fkey="slot-${i + 1}" aria-pressed="${d.slot === i + 1}">${i + 1}. ${s.name}<small>${w ? 'Written: ' + esc(w.name) : esc(s.job)}</small></button>`;
  }).join('')}</div></div></section>`;
}

function form(d) {
  return `<section class="panel"><h3>The skill</h3><div class="fields">
    <label class="wide">Name<input data-f="name" data-fkey="f-name" maxlength="60" value="${esc(d.name)}"></label>
    <label class="wide">Flavour line<small>Up to 20 words, and no rules in it.</small><input data-f="flavour" data-fkey="f-flavour" maxlength="200" value="${esc(d.flavour)}"></label>
    <label>EP<input type="number" min="0" data-f="ep" data-num data-fkey="f-ep" value="${esc(d.ep)}"></label>
    <label>Cast<select data-f="cast" data-fkey="f-cast">${options(CASTS, d.cast)}</select></label>
    <label>Lasts<input data-f="lasts" data-fkey="f-lasts" list="lastslist" value="${esc(d.lasts)}"></label>
    <label>Cooldown<small>Rounds; 0 is none</small><input type="number" min="0" data-f="cooldown" data-num data-fkey="f-cooldown" value="${esc(d.cooldown)}"></label>
    <label>Range<select data-f="range" data-fkey="f-range">${options(RANGES, d.range)}</select></label>
    <label>Area or targets<input data-f="area" data-fkey="f-area" list="arealist" value="${esc(d.area)}" placeholder="Leave empty for one target"></label>
    <label class="wide" id="triggerwrap">Trigger<small>Finishes "When…": an ally within 30 ft is hit</small><input data-f="trigger" data-fkey="f-trigger" value="${esc(d.trigger)}"></label>
    <label>Roll<select data-f="roll" data-fkey="f-roll">${Object.entries(ROLLS).map(([k, l]) => `<option value="${k}"${k === d.roll ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
    <label>Aspect<select data-f="aspect" data-fkey="f-aspect">${options(ASPECTS, d.aspect)}</select></label>
    <label class="wide" id="critwrap">On a critical<small>Optional. Otherwise a natural 20 rolls the damage dice twice.</small><input data-f="crit" data-fkey="f-crit" value="${esc(d.crit)}"></label>
    </div>
    <datalist id="lastslist">${LASTS.map(x => `<option value="${x}">`).join('')}</datalist><datalist id="arealist">${AREAS.map(x => `<option value="${x}">`).join('')}</datalist>
    <datalist id="taglist">${[...new Set(knownLists(d).tags)].filter(t => /^[A-Z]/.test(t)).sort().map(t => `<option value="${esc(t)}">`).join('')}</datalist></section>
    <section class="panel"><h3>What it does</h3>${d.effects.map(effectRow).join('') || '<p class="note" style="margin:0 0 10px">No effects yet. One verb and one twist is the aim, so most skills need one or two.</p>'}
    <div class="row">${Object.entries(KINDS).map(([k, l]) => `<button type="button" class="btn small" data-add="${k}" data-fkey="add-${k}">${l}</button>`).join('')}</div></section>`;
}

function effectRow(e, i) {
  const kinds = Object.entries(KINDS).map(([k, l]) => `<option value="${k}"${k === e.kind ? ' selected' : ''}>${l}</option>`).join('');
  let body = '';
  if (IS_NUMBER.includes(e.kind)) {
    body = `<label>Dice or amount<input data-e="${i}" data-k="dice" data-fkey="e${i}-dice" value="${esc(e.dice)}" placeholder="2d8 or 20"></label>
      <label class="check"><input type="checkbox" data-e="${i}" data-k="addMod" data-fkey="e${i}-mod"${e.addMod ? ' checked' : ''}>Add the mod</label>
      ${e.kind === 'temphp' ? '' : `<label>Over how many Rounds<input type="number" min="1" data-e="${i}" data-k="overTime" data-enum data-fkey="e${i}-over" value="${esc(e.overTime || 1)}"></label>`}
      <label>Separate targets<input type="number" min="1" data-e="${i}" data-k="targets" data-enum data-fkey="e${i}-targets" value="${esc(e.targets || 1)}"></label>`;
  } else if (e.kind === 'custom') {
    body = `<label class="wide">What happens<small>Use [Tags] from the glossary. Dice tables like: Roll a 1d6. [1-3 first] [4-6 second]</small><textarea data-e="${i}" data-k="text" data-fkey="e${i}-text">${esc(e.text)}</textarea></label>`;
  } else {
    body = `<label>${AMOUNT_LABEL[e.kind]}<input type="number" data-e="${i}" data-k="amount" data-enum data-fkey="e${i}-amount" value="${esc(e.amount)}"></label>`;
    if (e.kind === 'control') body += `<label>Condition<input data-e="${i}" data-k="condition" data-fkey="e${i}-cond" list="taglist" value="${esc(e.condition)}"></label>`;
  }
  return `<div class="effect"><div class="effect-head"><label>Effect ${i + 1}<select data-ekind="${i}" data-fkey="e${i}-kind">${kinds}</select></label><button type="button" class="btn small" data-remove="${i}">Remove</button></div><div class="fields">${body}</div></div>`;
}

const LABEL = { damage: 'Damage', heal: 'Healing', temphp: 'Temporary HP' };
const one = n => Math.round(n * 10) / 10;
function paint() {
  const d = cur();
  if (!d) return;
  $('triggerwrap').hidden = d.cast !== 'Reaction';
  $('critwrap').hidden = d.roll === 'none';
  const v = view(d), rules = Forge.compose(v), cells = Forge.docCells(v), segment = tiersOf(treeOf(d.tree), d.track)[d.tier - 1];
  $('preview').innerHTML = `<h4>${esc(d.name.trim() || 'Unnamed skill')}</h4>
    <p class="sub">${esc(treeOf(d.tree)?.name || d.tree)} · ${d.track === 'main' ? 'Main Path' : esc(d.track)}${segment ? ' · ' + esc(segment) : ''} · T${d.tier} · #${d.slot}</p>
    ${d.flavour.trim() ? `<p class="flavour">${esc(d.flavour.trim())}</p>` : ''}<p class="rules">${esc(rules) || 'Add an effect to write the rules.'}</p><hr>
    <dl><dt>EP</dt><dd>${esc(d.ep)}</dd>${cells.slice(3).map(c => { const [k, ...r] = c.split(': '); return `<dt>${esc(k)}</dt><dd>${esc(r.join(': '))}</dd>`; }).join('')}</dl>`;

  const r = Forge.row(d.track, d.tier), s = Forge.suggest(d.track, d.tier, d.slot), late = Forge.late(v);
  const meters = Forge.readout(v).filter(m => m.value != null).map((m, i) => {
    const over = m.value > m.limit, pct = Math.min(100, (m.value / m.limit) * 100);
    return `<div class="meter${over ? ' over' : ''}"><div class="meter-line"><span>${LABEL[m.kind]}</span><b>${one(m.value)} of ~${one(m.limit)}</b></div><div class="meter-track"><div class="meter-fill" style="width:${pct}%"></div></div>${late[i] ? `<p class="note" style="margin:3px 0 0">Level 30: ${one(late[i].value)}, against ~${Forge.BUDGET.late.hp} HP</p>` : ''}</div>`;
  }).join('');
  const flags = Forge.lint(v, knownLists(d)), taken = writtenAt(d.tree, d.track, d.tier, d.slot);
  if (taken) flags.unshift({ level: 'warn', message: `This slot already holds ${taken.name}.` });
  if (Number(d.ep) !== s.ep) flags.push({ level: 'warn', message: `The slot suggests ${s.ep} EP.` });
  $('budget').innerHTML = `<h3>Budget</h3><p class="facts">Tuned against level <b>${r.level}</b>: ~<b>${r.hp}</b> HP, ~<b>${r.ep}</b> EP, ~<b>${r.ap}</b> AP, <b>+${r.mod}</b> mod.</p>${meters}
    ${flags.length ? `<ul class="flags">${flags.map(f => `<li class="${f.level}">${esc(f.message)}</li>`).join('')}</ul>` : '<p class="clear">Inside the budget, and nothing to fix.</p>'}`;

  const same = state.skills.filter(x => x.tier === d.tier && x.slot === d.slot && (x.path === 'Main Path') === (d.track === 'main')).slice(0, 4);
  $('compare').innerHTML = `<h3>Written skills in this tier and slot</h3>${same.length ? `<ul class="compare">${same.map(x => `<li><a href="https://world-of-dissonance.github.io/wiki/${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a><small>${esc(x.tree)} · EP ${esc(x.ep)} · ${esc(x.cast)} · Cooldown ${esc(x.cooldown)}</small></li>`).join('')}</ul>` : '<p class="note" style="margin:0">None yet, so this one sets the example.</p>'}`;

  const list = $('draftlist')?.querySelector(`[data-pick="${state.current}"]`);
  if (list) list.lastChild.textContent = d.name || 'Unnamed skill';
}

// ---------- the tree map ----------
function mapView() {
  if (!state.trees.length) return `<section class="panel"><h2>No tree data</h2><p class="note" style="margin:0">The tree map needs the wiki's data, and it couldn't be loaded.</p></section>`;
  const written = state.skills.length, drafted = state.drafts.length;
  const cell = (tree, track, tier, name) => {
    const pips = [1, 2, 3, 4, 5].map(slot => {
      const w = writtenAt(tree.id, track, tier, slot), dr = state.drafts.findIndex(x => x.tree === tree.id && sameTrack(x.track, track) && x.tier === tier && x.slot === slot);
      const what = w ? w.name : dr >= 0 ? `draft: ${state.drafts[dr].name || 'unnamed'}` : 'empty';
      const label = `${tree.name}, ${track === 'main' ? 'Main Path' : track}, ${name}, slot ${slot}: ${what}`;
      return `<button type="button" class="pip${w ? ' written' : dr >= 0 ? ' drafted' : ''}" title="${esc(label)}" aria-label="${esc(label)}" data-goto="${esc(JSON.stringify([tree.id, track, tier, slot]))}"></button>`;
    }).join('');
    return `<td><span class="segname">${esc(name)}</span><div class="pips">${pips}</div></td>`;
  };
  const rowOf = (tree, label, track, tiers) => `<tr><th scope="row">${esc(label)}</th>${[0, 1, 2].map(i => cell(tree, track, i + 1, tiers[i] || `T${i + 1}`)).join('')}</tr>`;
  return `<p class="tally"><b>${written}</b> written, <b>${drafted}</b> drafted, of <b>${PLANNED}</b> planned. ${state.trees.length} of 10 trees are in the doc so far.</p>
    <p style="margin:0 0 14px"><span class="key"><span class="pip written" aria-hidden="true"></span>Written</span><span class="key"><span class="pip drafted" aria-hidden="true"></span>Drafted</span><span class="key"><span class="pip" aria-hidden="true"></span>Empty: click to start one</span></p>
    <div class="maps">${state.trees.map(t => `<section class="panel"><h2>${esc(t.name)}</h2><div class="scroll"><table><thead><tr><th scope="col">Path</th><th scope="col">T1</th><th scope="col">T2</th><th scope="col">T3</th></tr></thead><tbody>${rowOf(t, 'Main Path', 'main', t.main)}${t.branches.map(b => rowOf(t, b.name, b.name, b.tiers)).join('')}</tbody></table></div></section>`).join('')}</div>`;
}

// ---------- the reference ----------
function refView() {
  const B = Forge.BUDGET, d = cur(), hereLevel = d ? Forge.row(d.track, d.tier).level : null, hereCol = d ? Forge.column(d.track, d.tier) : 0;
  const rowsFor = { A: 'Main T1', B: 'Main T2, branch T1', C: 'Main T3, branch T2', D: 'Branch T3' };
  const rowTable = Object.entries(B.rows).map(([k, r]) => `<tr${r.level === hereLevel ? ' class="here"' : ''}><th scope="row">${rowsFor[k]}</th><td>${r.level}</td><td>~${r.hp}</td><td>~${r.ep}</td><td>~${r.ap}</td><td>+${r.mod}</td></tr>`).join('')
    + `<tr><th scope="row">For scale</th><td>${B.late.level}</td><td>~${B.late.hp}</td><td>~${B.late.ep}</td><td>~${B.late.ap}</td><td>+${B.late.mod}</td></tr>`;
  const dice = ['1d6', '1d8', '1d10'];
  const slotCols = (s, i) => (i === 0 ? dice.map(x => `${x} + mod`) : s.value ? s.value.map(v => `~${v}`) : i === 1 ? ['Modifiers', 'Modifiers', 'Modifiers'] : [0, 1, 2].map(() => `${s.hpShare * 100}% of HP`));
  const slotTable = B.slots.map((s, i) => `<tr${d && d.slot === i + 1 ? ' class="here"' : ''}><th scope="row">${i + 1}. ${s.name}</th><td>${s.job}</td><td>${s.cast}</td><td>${Math.round(s.epShare * 100)}%</td>${slotCols(s, i).map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
  const capNames = { ap: 'AP bonus', rollmod: 'Roll modifier', epdrain: 'EP drain', move: 'Movement (ft)', control: 'Hard control (Rounds)' };
  const capTable = Object.entries(B.caps).map(([k, v]) => `<tr><th scope="row">${capNames[k]}</th>${v.map((n, i) => `<td${i + 1 === hereCol ? ' class="here"' : ''}>${n}</td>`).join('')}</tr>`).join('');
  const table = (head, body) => `<div class="scroll"><table><thead><tr>${head.map(h => `<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
  return `<div class="refgrid">
    <section class="panel"><h2>Who a skill faces</h2>${table(['Segment', 'Earliest level', 'HP', 'EP', 'AP', 'Mod'], rowTable)}<p class="note">Judge a skill against its own row, not level 0 or level 30.${d ? ' The current draft\'s row is lit.' : ''}</p></section>
    <section class="panel"><h2>Modifier caps</h2>${table(['', 'Column 1', 'Column 2', 'Column 3'], capTable)}<p class="note">A segment's column is its tier, or one higher on a branch, capped at 3. Skills give one target at most +${B.caps.ap[2]} AP in total, and hard control always sits behind a save.</p></section>
    <section class="panel" style="grid-column:1 / -1"><h2>The segment template</h2>${table(['Slot', 'Job', 'Cast', 'EP (of row EP)', 'Column 1', 'Column 2', 'Column 3'], slotTable)}<p class="note">Cooldown is about EP ÷ 2 Rounds, and about EP × ${B.slots[4].cooldownShare} for a capstone. Values are averages, including the mod.</p></section>
    <section class="panel"><h2>Converters</h2><dl class="plain">
      <dt>Healing</dt><dd>Same limit as damage.</dd>
      <dt>Temporary HP</dt><dd>At most the Workhorse value, and it ends with the skill.</dd>
      <dt>Area</dt><dd>×${B.area} per target.</dd>
      <dt>Over time</dt><dd>The whole duration totals at most ×${B.overTime} the one-hit limit.</dd>
      <dt>Longer casts</dt><dd>+${B.extraCastRound * 100}% per Round after the first.</dd>
      <dt>Instant cast</dt><dd>At most ${B.instantHpShare * 100}% of row HP, except at-wills.</dd>
      <dt>Branch skills</dt><dd>Up to ×${B.branchAllowance}, in exchange for being narrower.</dd>
      <dt>Expected damage</dt><dd>About half the listed number, since attacks land about half the time.</dd>
      <dt>Defend</dt><dd>Worth about 5 EP, so a 5 EP skill costs about one Defend turn.</dd></dl>
      <h3>The three rolls</h3><dl class="plain"><dt>Attack</dt><dd>d20 + mod against AP.</dd><dt>Save</dt><dd>The target rolls d20 + mod against DC = 10 + your mod.</dd><dt>Contest</dt><dd>Both sides roll d20 + mod.</dd></dl>
      <p class="note">One roll per skill. A natural 20 rolls the damage dice twice; a natural 1 always fails.</p></section>
    <section class="panel"><h2>Rules of thumb</h2><ol class="rules-list">
      <li>Add the mod to every number. That keeps T1 skills worth a slot at level 30.</li>
      <li>Never use a percentage of HP. It breaks boss fights; cap anything that scales at "up to 4 × level".</li>
      <li>No prerequisite chains. With 15 slots, a skill that needs another skill costs two.</li>
      <li>Slots lock for three levels between reslots, so situational skills must be cheap or also useful in combat.</li>
      <li>One verb and one twist per skill, with at most two effects.</li>
      <li>Any two Main Path T1 segments must make a playable level 0 character, so each needs an at-will.</li>
      <li>Random tables belong to Chaos only. Size the die to the table, and keep every outcome within ±25% of the budget.</li>
      <li>Each tree owns one mechanic that no other tree uses.</li>
      <li>Flavour comes first, in up to 20 words. Then the rules: trigger, target, roll, success, crit, duration.</li>
      <li>Use only [tags] the glossary defines.</li></ol>
      <h3>Assumed, until the doc says otherwise</h3><ul class="rules-list"><li>An attack hits on meets-or-beats.</li><li>One cell is 5 ft.</li><li>Arcana Advances open branches: a branch segment needs the Main Path at that tier or higher.</li></ul>
      <p class="note">All of these numbers are estimates fitted to the existing skills, and they haven't been playtested.</p></section></div>`;
}

// ---------- actions ----------
function openDraft(d) {
  state.drafts.push(d);
  state.current = state.drafts.length - 1;
  state.tab = 'forge';
  state.confirmDelete = false;
  saveDrafts();
  render();
}
function replace(field, value) { cur()[field] = value; }
/** Moving a draft refills whatever the writer hasn't changed by hand. */
function replaced() {
  const d = cur(), s = Forge.suggest(d.track, d.tier, d.slot);
  for (const f of ['ep', 'cast', 'cooldown']) if (!d.edited?.[f]) d[f] = s[f];
  saveDrafts();
  render();
}
async function copyDoc() {
  const v = view(cur()), note = $('copynote'), over = Forge.lint(v, knownLists(cur())).filter(f => f.level === 'over').length;
  const done = over ? `Copied, with ${over} problem${over === 1 ? '' : 's'} still flagged. Paste it into the doc's empty slot.` : "Copied. Paste it into the doc's empty slot.";
  $('fallback').textContent = '';
  try {
    if (!window.ClipboardItem || !navigator.clipboard?.write) throw new Error('plain');
    await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([Forge.docHtml(v)], { type: 'text/html' }), 'text/plain': new Blob([Forge.docText(v)], { type: 'text/plain' }) })]);
    note.textContent = done;
  } catch (e) {
    try {
      await navigator.clipboard.writeText(Forge.docText(v));
      note.textContent = done + ' It went as plain text, so split it into the row\'s cells by hand.';
    } catch (e2) {
      note.textContent = "This browser wouldn't let the page copy. Select the text below and copy it yourself.";
      $('fallback').innerHTML = `<textarea readonly rows="5" aria-label="Skill text to copy">${esc(Forge.docText(v))}</textarea>`;
      $('fallback').firstChild.select();
    }
  }
}
function exportDrafts() {
  const url = URL.createObjectURL(new Blob([JSON.stringify({ v: 1, drafts: state.drafts }, null, 1)], { type: 'application/json' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: 'skill-forge-drafts.json' });
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function importDrafts(file) {
  let d;
  try { d = JSON.parse(await file.text()); } catch (e) { return showBanner(`${file.name} isn't a drafts file: it couldn't be read as JSON.`, true); }
  if (!d || d.v !== 1 || !Array.isArray(d.drafts) || !d.drafts.every(Forge.validDraft)) return showBanner(`${file.name} isn't a Skill Forge drafts file, so nothing was imported.`, true);
  const fresh = d.drafts.map(x => ({ ...filled(x), id: newId() }));
  state.drafts.push(...fresh);
  if (state.current < 0) state.current = 0;
  saveDrafts();
  showBanner(`Imported ${fresh.length} draft${fresh.length === 1 ? '' : 's'}.`);
  render();
}
function showBanner(text, err) {
  const b = $('banner');
  b.textContent = text;
  b.hidden = !text;
  b.classList.toggle('err', !!err);
}

$('tabs').addEventListener('click', e => {
  const k = e.target.dataset.tab;
  if (k) { state.tab = k; render(); }
});
$('importfile').addEventListener('change', e => {
  if (e.target.files[0]) importDrafts(e.target.files[0]);
  e.target.value = '';
});
$('bench').addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  const ds = t.dataset, d = cur();
  if (ds.pick) { state.current = Number(ds.pick); state.confirmDelete = false; render(); }
  else if (ds.tier) { replace('tier', Number(ds.tier)); replaced(); }
  else if (ds.slot) { replace('slot', Number(ds.slot)); replaced(); }
  else if (ds.add) {
    const r = Forge.column(d.track, d.tier) - 1, caps = Forge.BUDGET.caps;
    const start = { damage: { dice: ['1d6', '1d8', '1d10'][r], addMod: true }, heal: { dice: ['1d6', '1d8', '1d10'][r], addMod: true }, temphp: { dice: '1d6', addMod: true }, control: { amount: 1, condition: '' }, custom: { text: '' } }[ds.add] || { amount: caps[ds.add][r] };
    d.effects.push({ kind: ds.add, ...start });
    saveDrafts(); render();
  } else if (ds.remove) { d.effects.splice(Number(ds.remove), 1); saveDrafts(); render(); }
  else if (ds.goto) {
    const [tree, track, tier, slot] = JSON.parse(ds.goto), w = writtenAt(tree, track, tier, slot);
    const dr = state.drafts.findIndex(x => x.tree === tree && sameTrack(x.track, track) && x.tier === tier && x.slot === slot);
    if (w) window.open(`https://world-of-dissonance.github.io/wiki/${w.url}`, '_blank', 'noopener');
    else if (dr >= 0) { state.current = dr; state.tab = 'forge'; render(); }
    else openDraft(blank(tree, track, tier, slot));
  } else if (ds.act === 'new') {
    const base = d || { tree: state.trees[0]?.id || 'mind', track: 'main', tier: 1, slot: 1 };
    openDraft(blank(base.tree, base.track, base.tier, base.slot));
  } else if (ds.act === 'import') $('importfile').click();
  else if (ds.act === 'export') exportDrafts();
  else if (ds.act === 'copy') copyDoc();
  else if (ds.act === 'delete') { state.confirmDelete = true; render(); }
  else if (ds.act === 'delete-no') { state.confirmDelete = false; render(); }
  else if (ds.act === 'delete-yes') {
    state.drafts.splice(state.current, 1);
    state.current = Math.min(state.current, state.drafts.length - 1);
    state.confirmDelete = false;
    saveDrafts(); render();
  }
});
$('bench').addEventListener('input', e => {
  const t = e.target, d = cur();
  if (!d) return;
  if (t.dataset.f) {
    d[t.dataset.f] = t.dataset.num !== undefined ? Math.max(0, Number(t.value) || 0) : t.value;
    d.edited = { ...d.edited, [t.dataset.f]: true };
  } else if (t.dataset.e !== undefined) {
    const eff = d.effects[Number(t.dataset.e)];
    eff[t.dataset.k] = t.type === 'checkbox' ? t.checked : t.dataset.enum !== undefined ? Number(t.value) || 0 : t.value;
  } else return;
  saveDrafts();
  paint();
});
$('bench').addEventListener('change', e => {
  const t = e.target, d = cur();
  if (t.dataset.place === 'tree') { d.tree = t.value; d.track = 'main'; replaced(); }
  else if (t.dataset.place === 'track') { d.track = t.value; replaced(); }
  else if (t.dataset.ekind !== undefined) {
    d.effects[Number(t.dataset.ekind)] = { kind: t.value, ...(IS_NUMBER.includes(t.value) ? { dice: '1d6', addMod: true } : t.value === 'custom' ? { text: '' } : { amount: 1, condition: '' }) };
    saveDrafts(); render();
  }
});

// ---------- data: the wiki's files, or the copy saved in this page ----------
const DATA = { skills: ['skills.json', 'forgeskills'], trees: ['trees.json', 'forgetrees'], glossary: ['glossary.json', 'forgeglossary'] };
const wikiBase = () => (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? '/wod-wiki/site/' : 'https://world-of-dissonance.github.io/wiki/');
const saved = id => { try { return JSON.parse($(id).textContent); } catch (e) { return null; } };
async function loadData() {
  let live = true;
  for (const [key, [file, id]] of Object.entries(DATA)) {
    try {
      const r = await fetch(wikiBase() + file);
      if (!r.ok) throw new Error(r.status);
      state[key] = await r.json();
    } catch (e) {
      live = false;
      state[key] = saved(id) ?? state[key];
    }
  }
  const usable = state.trees.length > 0;
  if (!usable) showBanner("Couldn't reach the wiki's data, so the tree map and written skills are missing. The budgets still work. Reload to try again.", true);
  else if (!live) showBanner("Couldn't reach the live wiki, so this is using the copy saved in the page. It may be a little behind the doc.");
  render();
}
loadDrafts();
if (state.drafts.length) state.current = 0;
loadData();
render();
</script>
