<style>
  /* The DM's workbench, in the character maker's night-sky palette: lists on the left, the piece being made on the right. */
  :root {
    --ground: #121826; --panel: #1C2336; --ink: #262F48; --line: #3C4766; --text: #E6EEF3; --muted: #9AA6BF;
    --gold: #F2C14E; --teal: #5DC4B7; --error: #F08A7E; --paper: #F4EFE2; --paper-ink: #3A2A1A; --rule: #8E2B22;

    --chamfer: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--text); font: 15px/1.5 var(--ui); padding: 20px max(16px, env(safe-area-inset-left, 0px)) 40px; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .top { max-width: 1300px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; }
  .wordmark { font: 700 12px/1 var(--mono); letter-spacing: .28em; color: var(--muted); text-transform: uppercase; }
  h1 { margin: 6px 0 0; font: 600 clamp(26px, 4vw, 36px)/1.1 var(--display); }
  h2 { font: 600 20px/1.2 var(--display); margin: 0 0 4px; }
  h3 { font: 700 11.5px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }
  .lede { color: var(--muted); margin: 0 0 12px; }
  .tabs { max-width: 1300px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tabs button { font: 700 11.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--ink); border: 0; padding: 10px 14px; cursor: pointer; clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
  .tabs button[aria-selected="true"] { background: var(--gold); color: var(--ground); }
  .tabs .count { opacity: .7; margin-left: 4px; }
  .bench { max-width: 1300px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 17rem) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 860px) { .bench { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); padding: 16px; clip-path: var(--chamfer); }
  .list { display: grid; gap: 6px; }
  .list button.entry { text-align: left; background: var(--ink); color: var(--text); border: 1px solid var(--line); padding: 8px 12px; cursor: pointer; font: 15px/1.3 var(--ui); }
  .list button.entry small { display: block; color: var(--muted); font: 700 10.5px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .list button.entry[aria-current="true"] { border-color: var(--gold); box-shadow: inset 3px 0 0 var(--gold); }
  .btn { font: 600 14px/1 var(--ui); color: var(--text); background: var(--ink); border: 1px solid var(--line); padding: 10px 14px; cursor: pointer; }
  .btn.primary { background: var(--gold); color: var(--ground); border-color: var(--gold); }
  .btn.danger { color: var(--error); }
  .btn:disabled { opacity: .5; cursor: default; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 11rem), 1fr)); gap: 10px 12px; }
  .fields .wide { grid-column: 1 / -1; }
  label { display: grid; gap: 4px; font: 700 11px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  label small { font: 13px/1.3 var(--ui); letter-spacing: 0; text-transform: none; }
  input, select, textarea { width: 100%; font: 15px/1.4 var(--ui); color: var(--text); background: var(--ink); border: 1px solid var(--line); padding: 8px 10px; }
  textarea { resize: vertical; min-height: 5rem; }
  input[type=range] { padding: 0; accent-color: var(--gold); }
  .attack { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 6px; margin-bottom: 6px; }
  @media (max-width: 560px) { .attack { grid-template-columns: 1fr 1fr; } }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 20rem); gap: 18px; align-items: start; }
  @media (max-width: 1100px) { .split { grid-template-columns: 1fr; } }
  /* the stat block, printed like the in-game bestiary page */
  .block { background: var(--paper); color: var(--paper-ink); padding: 16px; border: 2px solid #B89A64; font: 15px/1.4 var(--caption); }
  .block h4 { font: 600 22px/1.1 var(--display); color: var(--rule); margin: 0; }
  .block .sub { font-style: italic; margin: 2px 0 8px; }
  .block hr { border: 0; border-top: 2px solid var(--rule); margin: 8px 0; }
  .block dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; font-family: var(--ui); font-size: 14px; }
  .block dt { font-weight: 600; color: var(--rule); }
  .block dd { margin: 0; }
  .aspects { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; font: 14px/1.3 var(--ui); }
  .aspects b { display: block; font: 700 10px/1.4 var(--mono); color: var(--rule); letter-spacing: .1em; }
  .diff { font: 600 15px/1.3 var(--ui); }
  .diff b { color: var(--gold); }
  .code { font: 12px/1.4 var(--mono); word-break: break-all; min-height: 6rem; }
  .note { color: var(--muted); font-size: 14px; }
  .note.ok { color: var(--teal); }
  .note.warn { color: var(--error); }
  .roll { font: 600 15px/1.4 var(--ui); color: var(--gold); min-height: 1.4em; }

<script>
const json = id => { try { return JSON.parse(document.getElementById(id).textContent); } catch (e) { return null; } };
const SKILLS = (json('skills')?.skills || []).map(s => s.name).filter(Boolean);
const CONDITIONS = (json('conditions')?.conditions || []).map(c => c.name).filter(Boolean);
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

// ---------- the bestiary's rules (the same numbers as Bestiary.java) ----------
const LEVEL_POINTS = [3, 1, 1, 1, 0, 2, 1, 0, 1, 0, 2, 1, 1, 1, 0, 2, 1, 1, 0, 0, 2, 0, 1, 1, 0, 2, 1, 0, 2, 0, 5];
const MAX_THREAT = LEVEL_POINTS.length - 1, INNATE = 3;
const FOCUSES = ['balanced', 'core', 'shell', 'essence'], ROLES = ['minion', 'standard', 'elite', 'boss'];
const BEHAVIORS = { brute: 'Brute: charges in and hits', skirmisher: 'Skirmisher: hits, then backs away', caster: 'Caster: keeps its distance, uses skills',
  guardian: 'Guardian: holds near where the fight began', coward: 'Coward: runs and defends when hurt' };
const TARGETS = { nearest: 'The nearest foe', weakest: 'The weakest foe', caster: 'The foe with the most skills', revenge: 'Whoever last hit it' };
const ROLE = { minion: [1, 0, 0], standard: [2, 0, 0], elite: [4, 1, 1], boss: [8, 2, 2] };
const num = (v, d) => { const n = parseInt(String(v ?? '').replace('+', ''), 10); return Number.isFinite(n) ? n : d; };
const points = t => LEVEL_POINTS.slice(0, Math.max(0, Math.min(MAX_THREAT, t)) + 1).reduce((a, b) => a + b, 0);
function scores(threat, focus, tweak) {
  const pool = INNATE + points(threat), s = [1, 1, 1], f = FOCUSES.indexOf(focus) - 1;
  if (f < 0) for (let i = 0; i < pool; i++) s[i % 3]++;
  else { const lead = Math.ceil(pool * 0.6); s[f] += lead; for (let i = 0; i < pool - lead; i++) s[(f + 1 + i % 2) % 3]++; }
  return s.map((v, i) => Math.max(1, v + (tweak[i] || 0)));
}
function stats(m) {
  const s = scores(num(m.threat, 0), m.focus, [num(m.tweak_core, 0), num(m.tweak_shell, 0), num(m.tweak_essence, 0)]), r = ROLE[m.role] || ROLE.standard;
  const hp = 6 + 4 * (s[2] - 1), ap = 10 + (s[1] >> 1), mp = 7 + (s[1] >> 2), init = s[0] >> 1;
  return { s, hp: num(m.hp, Math.max(1, hp * r[0] >> 1)), ap: num(m.ap, ap + r[1]), mp: num(m.mp, mp), init: num(m.init, init),
    mods: [(s[0] >> 1) + r[2], (s[1] >> 1) + r[2], (s[2] >> 1) + r[2]] };
}
const power = m => ({ minion: 0.5, elite: 2, boss: 4 }[m.role] || 1) * (num(m.threat, 0) + 1);
const DIFFICULTY = ['Trivial', 'Easy', 'Medium', 'Hard', 'Deadly'], DIFFICULTY_AT = [0, 0.4, 0.75, 1.1, 1.5];
const difficulty = (weight, size, level) => { const r = weight / Math.max(1, size * (level + 1)); let d = 0; DIFFICULTY_AT.forEach((t, i) => { if (r >= t) d = i; }); return d; };
const validDice = d => /^\d{0,2}d\d{1,3}([+-]\d{1,3})?$|^\d{1,3}$/.test(String(d).replace(/\s/g, ''));
const signed = n => (n >= 0 ? '+' : '') + n;
const atk = (name, aspect, dmg, range) => ({ name, aspect, dmg, range });
const TEMPLATES = {
  blank: { threat: 0, focus: 'balanced', behavior: 'brute', attacks: [atk('Strike', 'shell', '1d4', 1)] },
  grunt: { threat: 1, focus: 'shell', behavior: 'brute', attacks: [atk('Club', 'shell', '1d6', 1)] },
  archer: { threat: 2, focus: 'shell', behavior: 'skirmisher', target: 'weakest', attacks: [atk('Shortbow', 'shell', '1d6', 8), atk('Knife', 'shell', '1d4', 1)] },
  hexer: { threat: 3, focus: 'essence', behavior: 'caster', target: 'caster', skills: 'Logic and Order, Variable Violence', attacks: [atk('Staff', 'shell', '1d4', 1)] },
  sentinel: { threat: 3, focus: 'shell', behavior: 'guardian', attacks: [atk('Halberd', 'shell', '1d8', 2)] },
  swarmling: { threat: 0, focus: 'core', behavior: 'brute', role: 'minion', attacks: [atk('Bite', 'shell', '1d4', 1)] },
  boss: { threat: 5, focus: 'balanced', behavior: 'brute', target: 'revenge', role: 'boss', attacks: [atk('Cleave', 'shell', '2d6', 1), atk('Hurl', 'essence', '1d10', 6)] },
};
const monster = (kind = 'blank', name) => Object.assign({ name: name || (kind === 'blank' ? 'New monster' : kind[0].toUpperCase() + kind.slice(1)), threat: 0, focus: 'balanced',
  role: 'standard', tweak_core: 0, tweak_shell: 0, tweak_essence: 0, hp: '', ap: '', mp: '', init: '', skills: '', immune: '', behavior: 'brute',
  target: 'nearest', flee: 25, traits: '', loot: '' }, JSON.parse(JSON.stringify(TEMPLATES[kind])));

// ---------- state, saved in this browser ----------
const DRAFT = 'wod-workshop';
const blank = () => ({ monsters: [], tables: [], handouts: [], quests: [], items: [], party: { size: 4, level: 1 } });
let W = (() => { try { const d = JSON.parse(localStorage.getItem(DRAFT)); if (d && d.monsters) return Object.assign(blank(), d); } catch (e) {} return blank(); })();
let tab = 'monsters', pick = { monsters: 0, tables: 0, handouts: 0, quests: 0, items: 0 }, codeText = '', note = '';
const save = () => { try { localStorage.setItem(DRAFT, JSON.stringify(W)); } catch (e) {} };

// ---------- the code: "WOD1-" + base64url(deflate-raw(JSON)), the same format the game reads ----------
const pipe = async (bytes, stream) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());
const b64url = b => { let s = ''; for (const x of b) s += String.fromCharCode(x); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64url = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function encode(obj) { return 'WOD1-' + b64url(await pipe(new TextEncoder().encode(JSON.stringify(obj)), new CompressionStream('deflate-raw'))); }
async function decode(code) {
  code = code.replace(/\s+/g, '');
  if (!code.startsWith('WOD1-')) throw new Error('Codes start with WOD1-.');
  return JSON.parse(new TextDecoder().decode(await pipe(unb64url(code.slice(5)), new DecompressionStream('deflate-raw'))));
}
/** What goes to the game: only filled-in pieces, in the shapes the game checks. */
function payload() {
  return {
    kind: 'workshop', v: 1,
    monsters: W.monsters.filter(m => m.name.trim()).map(m => ({ ...m, attacks: m.attacks.filter(a => a.name.trim()) })),
    tables: W.tables.filter(t => t.name.trim() && t.entries.trim()),
    handouts: W.handouts.filter(h => h.title.trim()),
    quests: W.quests.filter(q => q.title.trim()),
    items: W.items.filter(i => i.name.trim() && i.id.trim()).map(i => {
      const o = { id: i.id, name: i.name, type: i.type, text: i.text };
      if (i.type === 'weapon') Object.assign(o, { dmg: i.dmg, range: num(i.range, 1) });
      if (i.type === 'armor') o.ap = num(i.ap, 1);
      return o;
    }),
  };
}

// ---------- drawing ----------
const TABS = [['monsters', 'Monsters'], ['tables', 'Random tables'], ['handouts', 'Handouts'], ['quests', 'Quests'], ['items', 'Items'], ['export', 'Bring into the game']];
function render() {
  document.getElementById('tabs').innerHTML = TABS.map(([id, label]) => `<button type="button" role="tab" data-tab="${id}" aria-selected="${tab === id}">${label}${W[id] ? `<span class="count">${W[id].length}</span>` : ''}</button>`).join('');
  const bench = document.getElementById('bench');
  if (tab === 'export') { bench.innerHTML = `<div class="panel" style="grid-column:1/-1">${exportView()}</div>`; return; }
  const list = W[tab], i = Math.min(pick[tab], list.length - 1);
  const label = { monsters: m => [m.name, `Threat ${m.threat} · ${m.role}`], tables: t => [t.name || 'Untitled', `${t.entries.split('\n').filter(x => x.trim()).length} entries`],
    handouts: h => [h.title || 'Untitled', `${h.text.length} characters`],
    quests: q => [q.title || 'Untitled', `${q.status} · ${q.objectives.split('\n').filter(x => x.trim()).length} objectives`], items: it => [it.name || 'Unnamed', it.type] }[tab];
  const add = { monsters: Object.keys(TEMPLATES).map(k => `<button type="button" class="btn" data-new="${k}">${k === 'blank' ? 'Blank' : k[0].toUpperCase() + k.slice(1)}</button>`).join(''),
    tables: `<button type="button" class="btn" data-new="table">New table</button>`, quests: `<button type="button" class="btn" data-new="quest">New quest</button>`, handouts: `<button type="button" class="btn" data-new="handout">New handout</button>`,
    items: `<button type="button" class="btn" data-new="item">New item</button>` }[tab];
  bench.innerHTML = `<div class="panel"><h3 style="margin-top:0">${tab === 'monsters' ? 'Start from' : 'Add'}</h3><div class="row">${add}</div>
      <h3>${esc(TABS.find(t => t[0] === tab)[1])}</h3><div class="list">${list.map((x, j) => { const [a, b] = label(x); return `<button type="button" class="entry" data-pick="${j}" aria-current="${j === i}">${esc(a)}<small>${esc(b)}</small></button>`; }).join('') || '<p class="note">Nothing yet.</p>'}</div></div>
    <div class="panel">${i < 0 ? '<p class="lede">Add one on the left.</p>' : { monsters: monsterView, tables: tableView, handouts: handoutView, quests: questView, items: itemView }[tab](list[i], i)}</div>`;
}
const field = (path, label, value, opts = {}) => {
  const attrs = `data-path="${path}"${opts.max ? ` maxlength="${opts.max}"` : ''}${opts.list ? ` list="${opts.list}"` : ''}${opts.ph ? ` placeholder="${esc(opts.ph)}"` : ''}`;
  const input = opts.area ? `<textarea ${attrs} rows="${opts.rows || 4}">${esc(value)}</textarea>`
    : opts.options ? `<select ${attrs}>${Object.entries(opts.options).map(([v, t]) => `<option value="${v}"${String(value) === v ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>`
    : `<input ${attrs} type="${opts.type || 'text'}" value="${esc(value)}"${opts.min != null ? ` min="${opts.min}" max="${opts.max2}"` : ''}>`;
  return `<label class="${opts.wide ? 'wide' : ''}">${esc(label)}${opts.hint ? `<small>${esc(opts.hint)}</small>` : ''}${input}</label>`;
};
const opts = arr => Object.fromEntries(arr.map(x => [x, x[0].toUpperCase() + x.slice(1)]));
function monsterView(m, i) {
  const d = stats(m);
  const bad = m.attacks.filter(a => a.name.trim() && !validDice(a.dmg)).map(a => a.name);
  return `<div class="split"><div>
    <h2>${esc(m.name || 'Monster')}</h2>
    <div class="fields">
      ${field('name', 'Name', m.name, { wide: true, max: 40 })}
      ${field('threat', `Threat ${m.threat}`, m.threat, { type: 'range', min: 0, max2: MAX_THREAT, hint: 'A Standard of Threat X is an even fight for one level-X character.' })}
      ${field('role', 'Role', m.role, { options: { minion: 'Minion (½ HP)', standard: 'Standard', elite: 'Elite (×2 HP, +1 AP, +1 to hit)', boss: 'Boss (×4 HP, +2 AP, +2 to hit)' } })}
      ${field('focus', 'Focus', m.focus, { options: opts(FOCUSES), hint: 'Where its points go.' })}
      ${field('tweak_core', 'Core ±', m.tweak_core, { type: 'number' })}${field('tweak_shell', 'Shell ±', m.tweak_shell, { type: 'number' })}${field('tweak_essence', 'Essence ±', m.tweak_essence, { type: 'number' })}
      ${['hp', 'ap', 'mp', 'init'].map(k => field(k, `${k.toUpperCase()} (by hand)`, m[k], { ph: 'auto' })).join('')}
    </div>
    <h3>Attacks (up to 6)</h3>
    ${m.attacks.map((a, j) => `<div class="attack">
      <input data-path="attacks.${j}.name" value="${esc(a.name)}" placeholder="Name" maxlength="30" aria-label="Attack ${j + 1} name">
      <select data-path="attacks.${j}.aspect" aria-label="Attack ${j + 1} aspect">${['shell', 'core', 'essence'].map(x => `<option${a.aspect === x ? ' selected' : ''}>${x}</option>`).join('')}</select>
      <input data-path="attacks.${j}.dmg" value="${esc(a.dmg)}" placeholder="1d6" aria-label="Attack ${j + 1} damage">
      <input data-path="attacks.${j}.range" type="number" min="1" max="30" value="${esc(a.range)}" aria-label="Attack ${j + 1} range in squares">
      <button type="button" class="btn danger" data-del-attack="${j}" aria-label="Remove attack ${j + 1}">&times;</button></div>`).join('')}
    <button type="button" class="btn" data-add-attack ${m.attacks.length >= 6 ? 'disabled' : ''}>Add attack</button>
    ${bad.length ? `<p class="note warn">Damage must be dice like 1d6+1: ${esc(bad.join(', '))}</p>` : ''}
    <div class="fields" style="margin-top:12px">
      ${field('skills', 'Skills', m.skills, { wide: true, hint: 'Names from the doc, comma separated.', list: 'skill-names' })}
      ${field('immune', 'Immune to', m.immune, { wide: true, hint: 'Conditions it can\'t be given, comma separated.', list: 'condition-names' })}
      ${field('behavior', 'Behavior on auto turns', m.behavior, { options: BEHAVIORS })}
      ${field('target', 'Goes after', m.target, { options: TARGETS })}
      ${m.behavior === 'coward' ? field('flee', 'Flees below (% HP)', m.flee, { type: 'number' }) : ''}
      ${field('traits', 'Traits', m.traits, { wide: true, area: true, rows: 3 })}
      ${field('loot', 'Loot', m.loot, { wide: true, area: true, rows: 2 })}
    </div>
    <div class="row" style="margin-top:12px"><button type="button" class="btn" data-dup>Duplicate</button><button type="button" class="btn danger" data-del>Delete</button></div>
  </div><div>
    <div class="block"><h4>${esc(m.name || 'Monster')}</h4>
      <div class="sub">${esc(m.role[0].toUpperCase() + m.role.slice(1))} · Threat ${m.threat} · ${esc(m.behavior)}</div><hr>
      <dl><dt>Armor Points</dt><dd>${d.ap}</dd><dt>Health</dt><dd>${d.hp}</dd><dt>Movement</dt><dd>${d.mp} squares (${d.mp * 5} ft)</dd><dt>Initiative</dt><dd>${signed(d.init)}</dd></dl><hr>
      <div class="aspects">${['Core', 'Shell', 'Essence'].map((n, k) => `<div><b>${n.toUpperCase()}</b>${d.s[k]} (${signed(d.mods[k])})</div>`).join('')}</div><hr>
      ${m.attacks.filter(a => a.name.trim()).map(a => { const k = ['core', 'shell', 'essence'].indexOf(a.aspect); return `<p style="margin:0 0 4px"><b>${esc(a.name)}.</b> ${signed(d.mods[k])} to hit (${esc(a.aspect)}), ${num(a.range, 1) <= 1 ? 'melee' : num(a.range, 1) + ' squares'}. ${esc(a.dmg)} damage.</p>`; }).join('')}
      ${m.skills ? `<p style="margin:4px 0 0"><b>Skills.</b> ${esc(m.skills)}</p>` : ''}${m.immune ? `<p style="margin:4px 0 0"><b>Immune.</b> ${esc(m.immune)}</p>` : ''}
      ${m.traits ? `<p style="margin:4px 0 0">${esc(m.traits)}</p>` : ''}</div>
    <h3>Encounter check</h3>

    All ${W.monsters.length} monsters together: <b>${DIFFICULTY[difficulty(W.monsters.reduce((a, x) => a + power(x), 0), num(W.party.size, 4), num(W.party.level, 1))]}</b></p>

}
function tableView(t) {
  return `<h2>${esc(t.name || 'Random table')}</h2><p class="lede">One entry per line. A number and a colon weights it: <code>3: Wolves</code> comes up three times as often as an unweighted line.</p>
    <div class="fields">${field('name', 'Name', t.name, { wide: true, max: 40 })}${field('entries', 'Entries', t.entries, { wide: true, area: true, rows: 10 })}</div>

    <div class="row" style="margin-top:12px"><button type="button" class="btn danger" data-del>Delete</button></div>`;
}
function handoutView(h) {

    <div class="row" style="margin-top:12px"><button type="button" class="btn danger" data-del>Delete</button></div>`;
}
function questView(q) {
  return `<h2>${esc(q.title || 'Quest')}</h2><p class="lede">Arrives in the game kept to the DM; on the Campaign screen's Quests tab, set it to Shared when the party learns of it. Players read shared quests in their Journal (H).</p>
    <div class="fields">${field('title', 'Title', q.title, { wide: true, max: 60 })}
      ${field('status', 'Status', q.status, { options: { active: 'Active', completed: 'Completed', failed: 'Failed' } })}
      ${field('text', 'What it\'s about', q.text, { wide: true, area: true, rows: 6 })}
      ${field('objectives', 'Objectives', q.objectives, { wide: true, area: true, rows: 6, hint: 'One per line. Start a line with [x] when it\'s done.' })}</div>
    <div class="row" style="margin-top:12px"><button type="button" class="btn danger" data-del>Delete</button></div>`;
}
function itemView(it) {
  return `<h2>${esc(it.name || 'Item')}</h2><p class="lede">Joins the item catalogue: give it with <code>/item give &lt;player&gt; ${esc(it.id || 'id')}</code>.</p>
    <div class="fields">${field('name', 'Name', it.name, { max: 60 })}${field('id', 'Id', it.id, { hint: 'Lowercase letters, digits, _', max: 32 })}
      ${field('type', 'Type', it.type, { options: { weapon: 'Weapon', armor: 'Armor', item: 'Other item' } })}
      ${it.type === 'weapon' ? field('dmg', 'Damage', it.dmg, { ph: '1d8' }) + field('range', 'Range (squares)', it.range, { type: 'number' }) : ''}
      ${it.type === 'armor' ? field('ap', 'AP bonus', it.ap, { type: 'number' }) : ''}
      ${field('text', 'Description', it.text, { wide: true, area: true, rows: 4 })}</div>
    ${it.type === 'weapon' && !validDice(it.dmg) ? '<p class="note warn">Damage must be dice like 1d8.</p>' : ''}
    <div class="row" style="margin-top:12px"><button type="button" class="btn danger" data-del>Delete</button></div>`;
}
function exportView() {
  const p = payload();
  return `<h2>Bring into the game</h2>
    <p class="lede">Everything here (${p.monsters.length} monsters, ${p.tables.length} tables, ${p.handouts.length} handouts, ${p.quests.length} quests, ${p.items.length} items) in one code. Copy it, then in the game open the DM camera (G) and click <b>Import from web</b>. Monsters land in the bestiary; tables, handout drafts and quests on the Campaign screen; items in the catalogue.</p>
    <div class="row"><button type="button" class="btn primary" data-copy>Copy code</button><span class="note ${note.startsWith('Copied') ? 'ok' : ''}" id="note">${esc(note)}</span></div>
    <textarea class="code" readonly aria-label="Import code" style="margin-top:10px">${esc(codeText)}</textarea>
    <h3>Edit from a code</h3>
    <p class="note">Paste a code made here to load it back (it replaces what's on this page).</p>
    <textarea class="code" id="loadcode" placeholder="WOD1-…" aria-label="Code to load"></textarea>
    <div class="row" style="margin-top:8px"><button type="button" class="btn" data-load>Load code</button><button type="button" class="btn danger" data-clear>Start over</button></div>`;
}

// ---------- input ----------
function setPath(obj, path, value) {
  const keys = path.split('.'), last = keys.pop();
  let o = obj;
  for (const k of keys) o = o[k];
  o[last] = value;
}
const current = () => W[tab][Math.min(pick[tab], W[tab].length - 1)];
document.addEventListener('input', e => {
  const t = e.target, path = t.dataset.path;
  if (!path) return;
  const v = t.type === 'number' || t.type === 'range' ? num(t.value, 0) : t.value;
  if (path.startsWith('party.')) setPath(W, path, v); else setPath(current(), path, v);
  save();
  if (t.type === 'range' || t.tagName === 'SELECT' || /^(attacks\.\d+\.(dmg|aspect|range)|tweak_|hp|ap|mp|init|party\.)/.test(path)) {
    const sel = `[data-path="${path}"]`; render(); const again = document.querySelector(sel); if (again && t.type !== 'range') { again.focus(); }
  }
});
document.addEventListener('change', e => { if (e.target.dataset.path) render(); });
document.addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; if (tab === 'export') codeText = await encode(payload()); note = ''; render(); return; }
  if (b.dataset.pick) { pick[tab] = +b.dataset.pick; render(); return; }
  if (b.dataset.new) {
    const fresh = { table: () => ({ name: 'New table', entries: '' }), quest: () => ({ title: 'New quest', text: '', objectives: '', status: 'active' }), handout: () => ({ title: 'New handout', text: '' }),
      item: () => ({ id: 'item_' + (W.items.length + 1), name: 'New item', type: 'weapon', dmg: '1d6', range: 1, ap: 1, text: '' }) }[b.dataset.new];
    W[tab].push(fresh ? fresh() : monster(b.dataset.new));
    pick[tab] = W[tab].length - 1;
  } else if (b.hasAttribute('data-del')) { W[tab].splice(pick[tab], 1); pick[tab] = Math.max(0, pick[tab] - 1); }
  else if (b.hasAttribute('data-dup')) { W.monsters.splice(pick.monsters + 1, 0, JSON.parse(JSON.stringify({ ...current(), name: current().name + ' (copy)' }))); pick.monsters++; }
  else if (b.hasAttribute('data-add-attack')) current().attacks.push(atk('', 'shell', '1d6', 1));
  else if (b.dataset.delAttack) current().attacks.splice(+b.dataset.delAttack, 1);
  else if (b.hasAttribute('data-test-roll')) { document.getElementById('rolled').textContent = rollTable(current().entries) || 'No entries yet.'; return; }
  else if (b.hasAttribute('data-copy')) {
    try { await navigator.clipboard.writeText(codeText); note = 'Copied. In the DM camera, click Import from web.'; }
    catch (err) { note = 'Couldn\'t reach the clipboard: select the code below and copy it.'; }
  } else if (b.hasAttribute('data-load')) {
    try {
      const o = await decode(document.getElementById('loadcode').value);
      if (o.kind !== 'workshop') throw new Error('That\'s a character code; load it in the character maker.');
      W = Object.assign(blank(), { monsters: (o.monsters || []).map(m => Object.assign(monster(), m)), tables: o.tables || [], handouts: o.handouts || [], quests: o.quests || [],
        items: (o.items || []).map(i => Object.assign({ dmg: '1d6', range: 1, ap: 1, text: '' }, i)) });
      codeText = await encode(payload()); note = 'Loaded.';
    } catch (err) { note = err.message || 'That code is damaged.'; }
  } else if (b.hasAttribute('data-clear')) { W = blank(); codeText = await encode(payload()); note = ''; }
  else return;
  save(); render();
});
/** A roll on a table the way the game rolls it (Campaign.rollTable): "3: Wolves" weighs 3. */
function rollTable(text) {
  const rows = text.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const m = /^(\d{1,3})\s*:\s*(.+)$/.exec(l); return m ? [Math.max(1, +m[1]), m[2]] : [1, l]; });
  const total = rows.reduce((a, r) => a + r[0], 0);
  if (!total) return null;
  let n = Math.floor(Math.random() * total);
  for (const [w, t] of rows) { if (n < w) return t; n -= w; }
  return null;
}
document.body.insertAdjacentHTML('beforeend', `<datalist id="skill-names">${SKILLS.map(s => `<option value="${esc(s)}">`).join('')}</datalist>
  <datalist id="condition-names">${CONDITIONS.map(s => `<option value="${esc(s)}">`).join('')}</datalist>`);
if (!W.monsters.length && !W.tables.length) { W.monsters.push(monster('grunt', 'Lychgate Thug')); W.tables.push({ name: 'Wandering monsters', entries: '3: Wolves\n2: Bandits\nA lost merchant' }); }
render();
</script>
